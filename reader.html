function initVerseToolbarEvents() {
  var verseView = document.getElementById('verseView');
  if (!verseView || verseView.getAttribute('data-verse-toolbar-bound') === '1') return;
  verseView.setAttribute('data-verse-toolbar-bound', '1');
  verseView.addEventListener('click', function(e) {
    if (e.target.closest('button, a, [data-audio-action]')) return;
    var item = e.target.closest('#verseList .verse-item');
    if (!item || item.style.display === 'none') return;
    var verseNum = parseInt(item.getAttribute('data-verse'), 10);
    if (!isNaN(verseNum)) selectVerse(verseNum, item);
  });
  verseView.addEventListener('keydown', function(e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var item = e.target.closest('#verseList .verse-item');
    if (!item || item.style.display === 'none') return;
    e.preventDefault();
    var verseNum = parseInt(item.getAttribute('data-verse'), 10);
    if (!isNaN(verseNum)) selectVerse(verseNum, item);
  });
  ['audio:start', 'audio:pause', 'audio:resume', 'audio:end', 'audio:error', 'gomna:bible_resume_session_changed'].forEach(function(evt) {
    window.addEventListener(evt, function() {
      syncVerseToolbarListenButton();
    });
  });
  var listenBtn = document.getElementById('opt4VerseListen');
  if (listenBtn) {
    listenBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      e.preventDefault();
      if (verseListenMode === 'chapter' || (!selectedVerseNums.length && verseListenMode !== 'range')) {
        playChapterAudio();
      } else if (verseListenMode === 'range') {
        playRangeAudio();
      } else if (selectedVerseNums.length > 1) {
        playSelectedVersesQueue();
      } else if (selectedVerseNums.length === 1) {
        playSingleSelectedVerse();
      } else {
        playChapterAudio();
      }
    });
  }
  document.addEventListener('click', function(e) {
    var menu = document.getElementById('verseToolbarTargetMenu');
    if (!menu || menu.hidden) return;
    if (e.target.closest('#verseToolbarTargetButton') || e.target.closest('#verseToolbarTargetMenu')) return;
    closeVerseToolbarTargetMenu();
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeVerseToolbarTargetMenu();
  });
}

function playChapterAudio() {
  var engine = window.GOMNA_AUDIO_ENGINE;
  if (!engine || !engine.playAudioRange || !currentBook || !currentChapter || !currentVerseCount) return;
  var bookAudioId = window.GOMNA_AUDIO_BOOK && window.GOMNA_AUDIO_BOOK.getBookAudioId ? window.GOMNA_AUDIO_BOOK.getBookAudioId(currentBook.name) : null;
  if (!bookAudioId) return;
  engine.playAudioRange(bookAudioId, currentChapter, 1, currentVerseCount);
}

function playRangeAudio() {
  var rangeBtn = document.querySelector('[data-audio-action="play-range"]');
  if (rangeBtn) rangeBtn.click();
}

function playSingleSelectedVerse() {
  var engine = window.GOMNA_AUDIO_ENGINE;
  var verse = selectedVerseNum || getToolbarActionVerse();
  if (!engine || !engine.playAudioById || !verse) return;
  if (!isVerseAudioAvailable(verse)) return;
  var audioId = getVerseAudioId(verse);
  if (!audioId) return;
  engine.playAudioById(audioId, { startTime: 0 });
}

function playSelectedVersesQueue() {
  var engine = window.GOMNA_AUDIO_ENGINE;
  if (!engine || !engine.playAudioQueue || !selectedVerseNums.length) return;
  var audioIds = selectedVerseNums
    .filter(isVerseAudioAvailable)
    .map(function(v) { return getVerseAudioId(v); })
    .filter(function(id) { return !!id; });
  if (!audioIds.length) return;
  engine.playAudioQueue(audioIds, { source: getSelectedVersesAudioQueueSource() });
}

function getVerseRangeModalHtml() {
  verseRangeModalMax = currentVerseCount;
  verseRangeSelStart = 0;
  verseRangeSelEnd = 0;
  return '<div class="reader-verse-range-actions">' +
    '<div class="verse-range-split">' +
    '<div class="verse-range-column">' +
    '<p class="verse-range-column-label">시작 절</p>' +
    '<p class="verse-range-column-hint" id="verseRangeStartHint">시작 절을 선택하세요</p>' +
    '<div class="verse-range-column-scroll">' +
    '<div class="verse-grid" id="verseRangeStartGrid"></div></div></div>' +
    '<div class="verse-range-column" id="verseRangeEndArea">' +
    '<p class="verse-range-column-label">끝 절</p>' +
    '<p class="verse-range-column-hint" id="verseRangeEndHint">끝 절을 선택하세요</p>' +
    '<div class="verse-range-column-scroll">' +
    '<div class="verse-grid" id="verseRangeEndGrid"></div></div>' +
    '<button type="button" id="rangeEndMoveAction" class="verse-range-move-action" data-range-move-action hidden disabled aria-hidden="true">이동 →</button>' +
    '</div></div>' +
    '<div class="verse-range-back-wrap">' +
    '<button type="button" class="verse-range-back-to-text" onclick="closeVerseRangeModal()" aria-label="본문으로 돌아가기">← 본문으로</button>' +
    '</div>' +
    '</div>';
}

function verseRangeSetHint(el, text, visible) {
  if (!el) return;
  el.textContent = text;
  el.classList.toggle('is-hint-hidden', !visible);
  el.setAttribute('aria-hidden', visible ? 'false' : 'true');
}

function verseRangeSyncHints(startVisible, endVisible) {
  var startEl = document.getElementById('verseRangeStartHint');
  var endEl = document.getElementById('verseRangeEndHint');
  verseRangeSetHint(startEl, VERSE_RANGE_START_HINT_TEXT, !!startVisible);
  verseRangeSetHint(endEl, VERSE_RANGE_END_HINT_TEXT, !!endVisible);
}

function verseRangeInitHints() {
  // 처음: 시작 안내만 표시, 끝 안내·이동은 숨김
  verseRangeSyncHints(true, false);
}

function getVerseRangePullOffset() {
  try {
    var spacer = document.getElementById('verseRangePullSpacer');
    if (!spacer) return 0;
    if (window.getComputedStyle(spacer).display === 'none') return 0;
    return spacer.getBoundingClientRect().height || spacer.offsetHeight || 0;
  } catch (e) {
    return 0;
  }
}

function getVerseRangeScrollEl() {
  var outer = document.getElementById('verseRangeModalScroll');
  var spacer = document.getElementById('verseRangePullSpacer');
  if (outer && spacer && window.getComputedStyle(spacer).display !== 'none') return outer;
  return document.getElementById('verseRangeModalBody') || outer;
}

function resetVerseRangePullScroll() {
  var scroll = getVerseRangeScrollEl();
  if (!scroll) return;
  var apply = function() {
    try { scroll.scrollTop = getVerseRangePullOffset(); } catch (e) {}
  };
  apply();
  requestAnimationFrame(function() {
    apply();
    requestAnimationFrame(apply);
  });
}

function verseRangeRefreshPreview() {
  var el = document.getElementById('verseRangePreviewText');
  if (!el) return;
  if (verseRangeSelStart > 0 && verseRangeSelEnd > 0 && verseRangeSelEnd >= verseRangeSelStart) {
    var n = verseRangeSelEnd - verseRangeSelStart + 1;
    el.textContent = verseRangeSelStart + '절 ~ ' + verseRangeSelEnd + '절 (' + n + '개 절)';
  } else if (verseRangeSelStart > 0) {
    el.textContent = '끝 절을 선택하세요';
  } else {
    el.textContent = '시작 절을 선택하세요';
  }
}

function verseRangeUpdateApplyBtnState() {
  var applyBtn = document.getElementById('verseRangeApplyBtn');
  if (!applyBtn) return;
  var ok = verseRangeSelStart > 0 && verseRangeSelEnd > 0 && verseRangeSelEnd >= verseRangeSelStart;
  applyBtn.disabled = !ok;
  applyBtn.style.opacity = ok ? '1' : '0.45';
  applyBtn.style.cursor = ok ? 'pointer' : 'not-allowed';
}

function verseRangeRangeClass(v) {
  var s = verseRangeSelStart, e = verseRangeSelEnd;
  if (s <= 0) return '';
  if (e > 0 && e >= s) {
    if (v < s || v > e) return '';
    return (v === s || v === e) ? ' verse-cell--range-end' : ' verse-cell--range-mid';
  }
  return (v === s) ? ' verse-cell--range-end' : '';
}

function verseRangeRenderStartGrid() {
  var host = document.getElementById('verseRangeStartGrid');
  if (!host) return;
  var html = '';
  for (var v = 1; v <= verseRangeModalMax; v++) {
    var rc = verseRangeRangeClass(v);
    html += '<button type="button" class="verse-cell' + rc + '" data-v="' + v + '">' + v + '</button>';
  }
  host.innerHTML = html;
}

function verseRangeRenderEndGrid() {
  var host = document.getElementById('verseRangeEndGrid');
  if (!host) return;
  var start = verseRangeSelStart;
  var html = '';
  for (var v = 1; v <= verseRangeModalMax; v++) {
    var isDis = start <= 0 || v < start;
    var dis = isDis ? ' disabled' : '';
    var rc = (!isDis && verseRangeSelEnd > 0) ? verseRangeRangeClass(v) : '';
    var disAttr = isDis ? ' disabled' : '';
    html += '<div class="verse-range-end-cell-wrap" data-v="' + v + '"><button type="button" class="verse-cell' + dis + rc + '"' + disAttr + ' data-v="' + v + '">' + v + '</button></div>';
  }
  host.innerHTML = html;
}

function verseRangeUpdateStatusTag() {
  var tag = document.getElementById('rangeStatusAction');
  if (!tag) return;
  var ready = verseRangeSelStart > 0 && verseRangeSelEnd > 0 && verseRangeSelEnd >= verseRangeSelStart;
  tag.textContent = ready ? '선택 완료' : (verseRangeSelStart > 0 ? '끝 절을 선택하세요' : '시작 절을 선택하세요');
  tag.disabled = true;
  tag.setAttribute('aria-disabled', 'true');
  tag.classList.remove('range-status-tag--move');
}

function verseRangeSyncEndMoveTag() {
  var button = document.getElementById('rangeEndMoveAction');
  var endArea = document.getElementById('verseRangeEndArea');
  if (!button || !endArea) return;
  var ready = verseRangeSelStart > 0 && verseRangeSelEnd > 0 && verseRangeSelEnd >= verseRangeSelStart;
  if (!ready) {
    button.hidden = true;
    button.disabled = true;
    button.setAttribute('aria-hidden', 'true');
    return;
  }
  var wrapper = document.querySelector('#verseRangeEndGrid .verse-range-end-cell-wrap[data-v="' + verseRangeSelEnd + '"]');
  if (!wrapper) return;
  var wrapperRect = wrapper.getBoundingClientRect();
  var areaRect = endArea.getBoundingClientRect();
  button.style.top = (wrapperRect.bottom - areaRect.top + 4) + 'px';
  button.hidden = false;
  button.disabled = false;
  button.setAttribute('aria-hidden', 'false');
}

function verseRangeSyncStartGridClasses() {
  var host = document.getElementById('verseRangeStartGrid');
  if (!host) return;
  var cells = host.querySelectorAll('.verse-cell');
  for (var i = 0; i < cells.length; i++) {
    var cell = cells[i];
    var v = parseInt(cell.getAttribute('data-v'), 10);
    var rc = verseRangeRangeClass(v);
    var isEnd = rc.indexOf('range-end') !== -1;
    var isMid = rc.indexOf('range-mid') !== -1;
    cell.classList.toggle('verse-cell--range-end', isEnd);
    cell.classList.toggle('verse-cell--range-mid', isMid);
    cell.setAttribute('aria-selected', (isEnd || isMid) ? 'true' : 'false');
  }
}

function verseRangeSyncEndGridClasses() {
  var host = document.getElementById('verseRangeEndGrid');
  if (!host) return;
  var start = verseRangeSelStart;
  var cells = host.querySelectorAll('.verse-cell');
  for (var i = 0; i < cells.length; i++) {

function searchTopicResults(query) {
  var results = [];
  [oldTestamentData, newTestamentData].forEach(function(data, idx) {
    if(!data || !data.books) return;
    data.books.forEach(function(book) {
      book.chapters.forEach(function(chapter) {
        if(!chapter.verses) return;
        chapter.verses.forEach(function(verse) {
          if(verse.text.indexOf(query) >= 0) {
            results.push({ref: book.name + ' ' + chapter.chapter + ':' + verse.verse, text: verse.text, book: book.name, chapter: chapter.chapter, verse: verse.verse, testament: idx === 0 ? 'old' : 'new'});
          }
        });
      });
    });
  });
  return results;
}

function _escapeSearchHtml(s) {
  return String(s || '').replace(/[&<>"']/g, function(m) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
  });
}

function _highlightTopicText(text, query) {
  var safe = _escapeSearchHtml(text);
  try {
    return safe.replace(new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g'), '<mark>' + _escapeSearchHtml(query) + '</mark>');
  } catch (e) {
    return safe;
  }
}

function _renderSearchResultCard(r, query, useBodyHighlight) {

  if (card.category) {
    html += '<div class="faith-resource-category">' + _escapeSearchHtml(card.category) + '</div>';
  }

var _lastSearchQuery = '';
var SEARCH_RETURN_STATE_KEY = 'gomna_search_return_state';
var SEARCH_RETURN_PENDING_KEY = 'gomna_search_return_pending';
var SEARCH_RETURN_STATE_MAX_AGE_MS = 30 * 60 * 1000;

function _formatFaithRelatedScriptureBtnText(label, rv) {
  var refLabel = label || (rv.book + ' ' + rv.chapter + ':' + (rv.verseEnd && rv.verseEnd !== rv.verse ? rv.verse + '~' + rv.verseEnd : rv.verse));

function readSearchReturnState() {
  try {
    var raw = sessionStorage.getItem(SEARCH_RETURN_STATE_KEY);
    if (!raw) return null;
    var state = JSON.parse(raw);
    if (!state || !state.query) return null;
    if (state.timestamp && Date.now() - state.timestamp > SEARCH_RETURN_STATE_MAX_AGE_MS) {
      sessionStorage.removeItem(SEARCH_RETURN_STATE_KEY);
      return null;
    }
    return state;
  } catch (e) { return null; }
}

function readSearchReturnPending() {
  try {
    var raw = sessionStorage.getItem(SEARCH_RETURN_PENDING_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) { return null; }
}

function saveSearchReturnState(faithCardId) {
  try {
    var query = (_lastSearchQuery || '').trim();
    if (!query) {
      var si = document.getElementById('searchInput');
      query = si ? si.value.trim() : '';
    }
    if (!query) return;
    var scrollEl = typeof getBibleListScrollContainer === 'function'
      ? getBibleListScrollContainer()
      : (document.scrollingElement || document.documentElement);
    var scrollY = scrollEl ? scrollEl.scrollTop : (window.scrollY || 0);
    sessionStorage.setItem(SEARCH_RETURN_STATE_KEY, JSON.stringify({
      query: query,
      scrollY: scrollY,
      source: 'search-related',
      faithCardId: faithCardId || null,
      returnPath: 'reader.html',
      bodyVisibleCount: _searchBodyVisibleCount,
      timestamp: Date.now()
    }));
  } catch (e) {}
}

function clearSearchReturnState() {
  try {
    sessionStorage.removeItem(SEARCH_RETURN_STATE_KEY);
    sessionStorage.removeItem(SEARCH_RETURN_PENDING_KEY);
  } catch (e) {}
}

function returnToSearchResults() {
  var state = readSearchReturnState();
  if (state && state.query) {
    try {
      sessionStorage.setItem(SEARCH_RETURN_PENDING_KEY, JSON.stringify({
        scrollY: state.scrollY,
        faithCardId: state.faithCardId || null,
        bodyVisibleCount: state.bodyVisibleCount || 30
      }));
    } catch (e) {}
    window.location.href = 'reader.html?q=' + encodeURIComponent(state.query);
    return false;
  }
  window.location.href = 'reader.html?focus=search';
  return false;
}

function restoreSearchReturnScroll(pending) {
  if (!pending) return;
  function applyScroll() {
    var scrollEl = typeof getBibleListScrollContainer === 'function'
      ? getBibleListScrollContainer()
      : (document.scrollingElement || document.documentElement);
    if (!scrollEl) return;
    if (pending.faithCardId) {
      var card = document.querySelector('.faith-resource-card[data-faith-id="' + pending.faithCardId + '"]');
      if (card) {
        var cardRect = card.getBoundingClientRect();
        var scrollRect = scrollEl.getBoundingClientRect ? scrollEl.getBoundingClientRect() : { top: 0 };
        var nextTop = scrollEl.scrollTop + (cardRect.top - scrollRect.top) - 12;
        scrollEl.scrollTop = Math.max(0, nextTop);
        return;
      }
    }
    if (typeof pending.scrollY === 'number' && pending.scrollY >= 0) {
      scrollEl.scrollTop = pending.scrollY;
    }
  }
  if (typeof requestAnimationFrame === 'function') {
    requestAnimationFrame(function() {
      requestAnimationFrame(function() {
        setTimeout(applyScroll, 60);
      });
    });
  } else {
    setTimeout(applyScroll, 100);
  }
}

function doSearch(resetBodyCount) {

  var query = document.getElementById('searchInput').value.trim();

  if (resetBodyCount !== false) _searchBodyVisibleCount = 30;
  _lastSearchQuery = query;
  if (window.GomnaAnalytics) GomnaAnalytics.trackSearch(query);
  switchTab('search');
  if (window.GomnaBibleSearch && oldTestamentData && newTestamentData) {
    GomnaBibleSearch.buildIndex(oldTestamentData, newTestamentData);
  }
  var topicResults = searchTopicResults(query);
  var faithResults = window.GomnaBibleSearch ? GomnaBibleSearch.searchFaithResources(query) : [];
  var bodyResults = [];
  if (window.GomnaBibleSearch) {
    bodyResults = GomnaBibleSearch.shouldUseLordPrayerBodyResults(query)
      ? GomnaBibleSearch.getLordPrayerBodyResults()
      : GomnaBibleSearch.searchBody(query);
  }
  renderSearchResults(query, topicResults, faithResults, bodyResults, _searchBodyVisibleCount);
  } finally {
    if (!hadSearchEntryPending) return;
    if (typeof requestAnimationFrame === 'function') {
      requestAnimationFrame(function() {
        requestAnimationFrame(function() {
          document.documentElement.classList.remove('search-entry-pending');
        });
      });
    } else {
      document.documentElement.classList.remove('search-entry-pending');
    }
  }
}

function buildScriptureEntryVerseList(verseStart, verseEnd, maxVerse) {
  var start = parseInt(verseStart, 10);
  var end = parseInt(verseEnd, 10);

<script>
/* ── home commentary: 첫페이지 말씀풀이 → reader 자동 팝업 ── */
(function(){
  'use strict';
  var pending=window.__GOMNA_HOME_COMMENTARY_PENDING||null;
  var opened=false;
  var retryCount=0;
  var MAX_RETRY=40;
  if(!pending){
    try{
      var p=new URLSearchParams(location.search);
      if(p.get('commentary')==='1'&&p.get('source')==='home-main-commentary'){
        pending={
          book:(p.get('book')||'').trim(),
          chapter:parseInt(p.get('chapter'),10),
          verse:parseInt(p.get('verse')||'1',10)
        };
      }
    }catch(e){}
  }
  if(!pending||!pending.book||!pending.chapter||isNaN(pending.verse))return;

  function finishLoading(){
    document.documentElement.classList.remove('gomna-home-commentary-loading');
  }

  function tryOpen(){
    if(opened||retryCount++>MAX_RETRY)return;
    if(!window.currentBook||window.currentBook.name!==pending.book)return;
    if(Number(window.currentChapter)!==pending.chapter)return;
    var list=document.getElementById('verseList');
    if(!list||!list.querySelector('.verse-item[data-verse="'+pending.verse+'"]'))return;
    if(typeof showCommentary!=='function')return;
    opened=true;
    finishLoading();
    showCommentary(pending.verse);
  }

  function scheduleTry(){
    tryOpen();
    setTimeout(tryOpen,80);
    setTimeout(tryOpen,400);
    setTimeout(tryOpen,1000);
    setTimeout(tryOpen,2500);
  }

  window.addEventListener('gomna:verse_list_rendered',scheduleTry);
  if(document.readyState!=='loading')scheduleTry();
})();
</script>
<script>
/* ── home listen: 첫페이지 듣기 → reader 자동 재생 ── */
(function(){
  'use strict';
  var pending=null;
  var retryCount=0;
  var MAX_RETRY=40;
  var playbackRequested=false;
  try{
    var p=new URLSearchParams(location.search);
    var src=p.get('source');
    if(p.get('listen')==='1'&&(src==='home-daily'||src==='home-main-listen')){
      pending={
        book:(p.get('book')||'').trim(),
        chapter:parseInt(p.get('chapter'),10),
        startVerse:parseInt(p.get('startVerse')||p.get('verse'),10),
        endVerse:parseInt(p.get('endVerse')||p.get('startVerse')||p.get('verse'),10),
        verse:parseInt(p.get('verse')||p.get('startVerse'),10)
      };
    }
  }catch(e){}
  if(!pending||!pending.book||!pending.chapter||isNaN(pending.startVerse)||isNaN(pending.endVerse))return;

  function showAutoplayHelp(verse){
    var msg='오디오 시작을 위해 듣기 버튼을 한 번 더 눌러주세요.';
    if(typeof window.GOMNA_AUDIO_TOAST==='function')window.GOMNA_AUDIO_TOAST(msg);
    focusListenButton(verse);
  }

  function focusListenButton(verse){
    var item=document.querySelector('.verse-item[data-verse="'+verse+'"]');
    if(!item)return;
    try{item.scrollIntoView({behavior:'smooth',block:'center'});}catch(e){item.scrollIntoView();}
    setTimeout(function(){
      var btn=item.querySelector('.gomna-audio-verse-button');
      if(btn){
        try{btn.focus({preventScroll:true});}catch(e){btn.focus();}
      }
    },350);
  }

  function manifestReady(){
    var c=window.GOMNA_AUDIO_CONFIG;
    return !!(c&&c.manifestLoadStatus==='loaded'&&c.manifestData);
  }

  function tryPlay(){
    if(playbackRequested||retryCount++>MAX_RETRY)return;
    if(!window.currentBook||window.currentBook.name!==pending.book)return;
    if(Number(window.currentChapter)!==pending.chapter)return;
    if(!manifestReady())return;
    var bookId=window.GOMNA_AUDIO_BOOK&&window.GOMNA_AUDIO_BOOK.getBookAudioId
      ?window.GOMNA_AUDIO_BOOK.getBookAudioId(pending.book):null;
    if(!bookId)return;
    var engine=window.GOMNA_AUDIO_ENGINE;
    if(!engine||!engine.playAudioRange)return;
    var item=document.querySelector('.verse-item[data-verse="'+pending.startVerse+'"]');
    if(!item)return;

    playbackRequested=true;
    focusListenButton(pending.startVerse);

    function cleanup(){
      window.removeEventListener('audio:start',onStart);
      window.removeEventListener('audio:error',onError);
    }
    function onStart(){
      cleanup();
    }
    function onError(e){
      var d=e&&e.detail;
      if(d&&(d.reason==='play_rejected'||d.reason==='play_error')){
        cleanup();
        playbackRequested=false;
        showAutoplayHelp(pending.startVerse);
      }
    }
    window.addEventListener('audio:start',onStart);
    window.addEventListener('audio:error',onError);

    var started=engine.playAudioRange(bookId,pending.chapter,pending.startVerse,pending.endVerse);
    if(!started){
      cleanup();
      playbackRequested=false;
      showAutoplayHelp(pending.startVerse);
    }
  }

  function scheduleTry(){
    setTimeout(tryPlay,80);
    setTimeout(tryPlay,600);
    setTimeout(tryPlay,1500);
    setTimeout(tryPlay,3000);
  }

  window.addEventListener('gomna:verse_list_rendered',scheduleTry);
  window.addEventListener('gomna:manifest_loaded',scheduleTry);
})();
</script>
<script>
/* ── scripture entry: 오늘의 말씀 / 검색 관련 본문 / 길잡이 연관 구절 공통 본문 진입 ── */
(function(){
  'use strict';
  var pending=null;
  var returnLock=false;
  var returnBtn=null;
  var entryRevealCompleted=false;
  try{
    pending=parseScriptureEntryFromSearchParams(new URLSearchParams(location.search));
  }catch(e){}
  if(!pending)return;

  window.returnToTodayWordCard=function(){
    if(returnLock)return false;
    returnLock=true;
    window.location.href='index.html#today-word-card';
    return false;
  };

  function removeDailyReturnBtn(){
    if(returnBtn&&returnBtn.parentNode)returnBtn.parentNode.removeChild(returnBtn);
    returnBtn=null;
  }

  function clearSourceReturnUI(){
    removeDailyReturnBtn();
    if(typeof window.__gomnaClearGuideEntryReturn==='function')window.__gomnaClearGuideEntryReturn();
  }

  window.exitScriptureEntryView=function(){
    if(!pending)return;
    pending=null;
    clearSourceReturnUI();
    if(typeof clearVerseSelection==='function')clearVerseSelection();
    revealScriptureEntry();
  };
  window.exitDailyWordView=window.exitScriptureEntryView;

  function revealScriptureEntry(){
    document.documentElement.classList.remove('scripture-entry-pending');
  }
  window.__gomnaRevealScriptureEntry=revealScriptureEntry;
  window.__gomnaRevealHomeDailyRead=revealScriptureEntry;

  function getScriptureEntryViewportInsets(){
    var hdr=document.getElementById('verseReadHeader');
    var bar=document.getElementById('opt4BottomBar');
    var dock=document.getElementById('scriptureDock');
    var topInset=hdr&&hdr.offsetParent!==null?hdr.getBoundingClientRect().height:0;
    var bottomInset=0;
    if(bar&&bar.offsetParent!==null)bottomInset+=bar.getBoundingClientRect().height;
    if(dock&&dock.offsetParent!==null)bottomInset+=dock.getBoundingClientRect().height;
    var pullOffset=typeof getMobileTopPullOffset==='function'?getMobileTopPullOffset():0;
    return{top:topInset+pullOffset+12,bottom:bottomInset+12};
  }

  function getElementDocumentTop(el){
    var top=0;
    while(el){
      top+=el.offsetTop;
      el=el.offsetParent;
    }
    return top;
  }

  function centerScriptureEntryRangeInViewport(firstItem,lastItem){
    if(!firstItem||!lastItem)return;
    var scrollEl=typeof getBibleListScrollContainer==='function'
      ?getBibleListScrollContainer()
      :(document.scrollingElement||document.documentElement);
    if(!scrollEl)return;
    void firstItem.offsetHeight;
    void lastItem.offsetHeight;
    var insets=getScriptureEntryViewportInsets();
    var usableTop=insets.top;
    var usableBottom=window.innerHeight-insets.bottom;
    var usableHeight=Math.max(0,usableBottom-usableTop);
    var viewportCenter=(usableTop+usableBottom)/2;
    var firstRect=firstItem.getBoundingClientRect();
    var lastRect=lastItem.getBoundingClientRect();
    var rangeTop=firstRect.top;
    var rangeBottom=lastRect.bottom;
    var rangeHeight=Math.max(0,rangeBottom-rangeTop);
    var rangeCenter=(rangeTop+rangeBottom)/2;
    var currentTop=scrollEl.scrollTop||window.pageYOffset||0;
    var nextTop;
    if(rangeHeight>=usableHeight-8){
      nextTop=currentTop+(rangeTop-usableTop);
    }else{
      nextTop=currentTop+(rangeCenter-viewportCenter);
    }
    if(nextTop<0)nextTop=0;
    var maxScroll=Math.max(0,(scrollEl.scrollHeight||0)-(scrollEl.clientHeight||window.innerHeight));
    if(nextTop>maxScroll)nextTop=maxScroll;
    try{scrollEl.scrollTo({top:nextTop,behavior:'auto'});}catch(e){scrollEl.scrollTop=nextTop;}
  }

  function scrollScriptureEntryVerseInstant(verseNum){
    var item=document.querySelector('#verseList .verse-item[data-verse="'+verseNum+'"]');
    if(!item)return;
    var scrollEl=typeof getBibleListScrollContainer==='function'
      ?getBibleListScrollContainer()
      :(document.scrollingElement||document.documentElement);
    if(!scrollEl)return;
    var insets=getScriptureEntryViewportInsets();
    var padTop=insets.top;
    var padBottom=insets.bottom;
    void item.offsetHeight;
    var itemDocTop=getElementDocumentTop(item);
    var itemHeight=item.offsetHeight||0;
    var viewport=window.innerHeight;
    var nextTop=itemDocTop-padTop;
    if(itemHeight+padTop+padBottom+24<viewport){
      var centered=itemDocTop-((viewport-itemHeight)/2);
      var minTop=itemDocTop-padTop;
      var maxTop=itemDocTop+itemHeight-(viewport-padBottom);
      nextTop=Math.min(Math.max(centered,minTop),maxTop);
    }
    if(nextTop<0)nextTop=0;
    var maxScroll=Math.max(0,(scrollEl.scrollHeight||0)-(scrollEl.clientHeight||viewport));
    if(nextTop>maxScroll)nextTop=maxScroll;
    try{scrollEl.scrollTo({top:nextTop,behavior:'auto'});}catch(e){scrollEl.scrollTop=nextTop;}
  }

  function attachSourceReturnUI(anchorItem){
    if(!pending||!anchorItem)return;
    if(pending.source==='home-daily-read'){
      removeDailyReturnBtn();
      var btn=document.createElement('button');
      btn.type='button';
      btn.className='daily-word-return-btn';
      btn.setAttribute('data-daily-word-return','1');
      btn.textContent='← 오늘의 말씀으로 돌아가기';
      btn.setAttribute('aria-label','오늘의 말씀으로 돌아가기');
      btn.addEventListener('click',function(e){
        e.preventDefault();
        e.stopPropagation();
        returnToTodayWordCard();
      });
      anchorItem.insertAdjacentElement('afterend',btn);
      returnBtn=btn;
      return;
    }
    if(pending.source==='search-related'){
      removeDailyReturnBtn();
      var searchBtn=document.createElement('button');
      searchBtn.type='button';
      searchBtn.className='daily-word-return-btn';
      searchBtn.setAttribute('data-search-return','1');
      searchBtn.textContent='← 검색 결과로 돌아가기';
      searchBtn.setAttribute('aria-label','검색 결과로 돌아가기');
      searchBtn.addEventListener('click',function(e){
        e.preventDefault();
        e.stopPropagation();
        if(typeof returnToSearchResults==='function')returnToSearchResults();
      });
      anchorItem.insertAdjacentElement('afterend',searchBtn);
      returnBtn=searchBtn;
      return;
    }
    if(pending.source==='guide-related'&&pending.guideCat&&typeof window.__gomnaAttachGuideEntryReturn==='function'){
      window.__gomnaAttachGuideEntryReturn(anchorItem,pending.guideTestament||'old',pending.guideCat);
    }
  }

  function finishScriptureEntryReveal(firstItem,lastItem){
    if(pending.source==='search-related'){
      attachSourceReturnUI(lastItem);
      function applySearchRangeCenter(){
        centerScriptureEntryRangeInViewport(firstItem,lastItem);
        entryRevealCompleted=true;
        revealScriptureEntry();
      }
      if(typeof requestAnimationFrame==='function'){
        requestAnimationFrame(function(){
          requestAnimationFrame(applySearchRangeCenter);
        });
      }else{
        applySearchRangeCenter();
      }
      return;
    }
    scrollScriptureEntryVerseInstant(pending.scrollVerse||pending.verses[0]);
    revealScriptureEntry();
    attachSourceReturnUI(lastItem);
    entryRevealCompleted=true;
  }

  function refreshPendingVerses(){
    if(!pending)return false;
    try{
      var fresh=parseScriptureEntryFromSearchParams(new URLSearchParams(location.search));
      if(!fresh||fresh.source!==pending.source||fresh.book!==pending.book||fresh.chapter!==pending.chapter)return false;
      pending.verses=fresh.verses.slice();
      pending.scrollVerse=fresh.scrollVerse;
      return pending.verses.length>0;
    }catch(e){return false;}
  }

  function activateScriptureEntryHighlight(){
    if(!pending){revealScriptureEntry();return false;}
    if(!window.currentBook||window.currentBook.name!==pending.book)return false;
    if(Number(window.currentChapter)!==pending.chapter)return false;
    refreshPendingVerses();
    if(!pending.verses.length){revealScriptureEntry();return false;}
    var list=document.getElementById('verseList');
    if(!list){revealScriptureEntry();return false;}
    var highlightVerses=pending.verses.slice();
    if(window.currentVerseCount&&window.currentVerseCount>0){
      highlightVerses=buildScriptureEntryVerseList(highlightVerses[0],highlightVerses[highlightVerses.length-1],window.currentVerseCount);
      if(!highlightVerses.length){revealScriptureEntry();return false;}
      pending.verses=highlightVerses;
      pending.scrollVerse=highlightVerses[0];
    }
    var firstVerse=highlightVerses[0];
    var lastVerse=highlightVerses[highlightVerses.length-1];
    var firstItem=list.querySelector('.verse-item[data-verse="'+firstVerse+'"]');
    var lastItem=list.querySelector('.verse-item[data-verse="'+lastVerse+'"]');
    if(!firstItem||!lastItem){revealScriptureEntry();return false;}
    if(typeof restoreVerseSelection==='function')restoreVerseSelection(highlightVerses);
    if(entryRevealCompleted)return true;
    if(typeof requestAnimationFrame==='function'){
      requestAnimationFrame(function(){finishScriptureEntryReveal(firstItem,lastItem);});
    }else{
      finishScriptureEntryReveal(firstItem,lastItem);
    }
    return true;
  }

  window.addEventListener('gomna:verse_list_rendered',function(){
    activateScriptureEntryHighlight();
  });
})();
</script>
<script>
/* ── home-ui-v1: 마지막 읽은 위치(gomna_last_read) + 방문일(gomna_visit_days) 저장 ──
   기존 로직은 수정하지 않고, 장 렌더링 완료 시 발생하는
   'gomna:verse_list_rendered' 이벤트만 구독해서 저장한다. */
(function(){
  'use strict';
  function saveLastRead(bookName, chapter){
    try{
      if(!bookName || !chapter) return;
      localStorage.setItem('gomna_last_read', JSON.stringify({
        book: String(bookName),
        chapter: Number(chapter),
        verse: 1,
        timestamp: Date.now()
      }));
    }catch(e){ /* storage 불가 환경 무시 */ }
  }
  function saveVisitDay(){
    try{
      var now = new Date();
      var key = now.getFullYear() + '-' +
        String(now.getMonth()+1).padStart(2,'0') + '-' +
        String(now.getDate()).padStart(2,'0');
      var raw = localStorage.getItem('gomna_visit_days');
      var days = [];
      if(raw){
        var parsed = JSON.parse(raw);
        if(Array.isArray(parsed)) days = parsed;
      }
      if(days.indexOf(key) === -1){
        days.push(key);
        localStorage.setItem('gomna_visit_days', JSON.stringify(days));
      }
    }catch(e){ /* storage 불가 환경 무시 */ }
  }
  window.addEventListener('gomna:verse_list_rendered', function(e){
    var d = e && e.detail;
    var bookName = (d && d.bookName) || (window.currentBook && window.currentBook.name);
    var chapter = (d && d.chapter) || window.currentChapter;
    saveLastRead(bookName, chapter);
  });
  saveVisitDay();
})();
</script>
