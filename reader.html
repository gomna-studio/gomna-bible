var _commentaryLoaded = {}; // 책별 주석 데이터는 외부 파일에서 동적 로드됨

var BOOK_FILE_MAP = {

  "누가복음":"luke","요한복음":"john","사도행전":"acts","로마서":"romans",
  "고린도전서":"1corinthians","고린도후서":"2corinthians","갈라디아서":"galatians",
  "에베소서":"ephesians","빌립보서":"philippians","골로새서":"colossians",
  "데살로니가전서":"1thessalonians","데살로니가후서":"2thessalonians",

  "히브리서":"hebrews","야고보서":"james","베드로전서":"1peter","베드로후서":"2peter",
  "요한일서":"1john","요한이서":"2john","요한삼서":"3john","유다서":"jude","요한계시록":"revelation"
};

function loadPastorCommentary(bookName) {
  if (_commentaryLoaded[bookName]) return Promise.resolve();
  if (_commentaryPromises[bookName]) return _commentaryPromises[bookName];
  var fileBase = BOOK_FILE_MAP[bookName];
  if (!fileBase) return Promise.resolve();
  _commentaryPromises[bookName] = new Promise(function(resolve) {
    var s = document.createElement('script');
    s.src = 'gomna_data_' + fileBase + '.js';
    s.async = true;
    s.onload = function() { _commentaryLoaded[bookName] = true; resolve(); };
    s.onerror = function() { resolve(); };
    document.head.appendChild(s);
  });
  return _commentaryPromises[bookName];
}

/* Locale structured card bodies (en-US / ja-JP). Cached once per locale+book. */
var _localeCommentaryCards = {};

function getCommentaryCardLocale() {
  var lang = typeof getReaderUiLangCode === 'function' ? getReaderUiLangCode() : 'ko';
  if (lang === 'en') return 'en-US';
  if (lang === 'ja') return 'ja-JP';
  return 'ko-KR';
}

function peekLocaleCommentaryCards(locale, bookId) {
  if (!locale || !bookId) return null;
  return _localeCommentaryCards[locale + '|' + bookId] || null;
}

function loadLocaleCommentaryCards(locale, bookId) {
  var cacheKey = locale + '|' + bookId;
  var entry = _localeCommentaryCards[cacheKey];
  if (entry && entry.status === 'ready') return Promise.resolve(entry);
  if (entry && entry.status === 'error') return Promise.resolve(entry);
  if (entry && entry.promise) return entry.promise;
  entry = _localeCommentaryCards[cacheKey] = {
    status: 'loading',
    data: null,
    error: null,
    promise: null
  };
  var assetVersion = String(window.GOMNA_ASSET_VERSION || '').trim();
  var cardsUrl =
    'data/commentary-cards/' +
    encodeURIComponent(locale) +
    '/' +
    encodeURIComponent(bookId) +
    '.json' +
    (assetVersion ? ('?v=' + encodeURIComponent(assetVersion)) : '');
  entry.promise = fetch(cardsUrl, { credentials: 'same-origin', cache: 'no-cache' }).then(function(res) {
    if (res.status === 404) {
      entry.status = 'ready';
      entry.data = { verses: {} };
      entry.promise = null;
      return entry;
    }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json().then(function(json) {
      entry.status = 'ready';
      entry.data = json && typeof json === 'object' ? json : { verses: {} };
      if (!entry.data.verses) entry.data.verses = {};
      entry.promise = null;
      return entry;
    });
  }).catch(function(err) {
    entry.status = 'error';
    entry.error = err;
    entry.data = null;
    entry.promise = null;
    return entry;
  });
  return entry.promise;
}

function resolvePastorCommentaryVerseData(dataKey, bookName) {
  var locale = getCommentaryCardLocale();
  if (locale === 'ko-KR') {
    try {
      if (window.pastorCommentaryData && window.pastorCommentaryData[dataKey]) {
        return { ok: true, data: window.pastorCommentaryData[dataKey], source: 'ko-KR' };
      }
    } catch (eKo) { /* ignore */ }
    return { ok: false, reason: 'missing', source: 'ko-KR' };
  }
  var bookId = BOOK_FILE_MAP[bookName];
  if (!bookId) return { ok: false, reason: 'unavailable', source: locale };
  var entry = peekLocaleCommentaryCards(locale, bookId);
  if (!entry || entry.status === 'loading') {
    return { ok: false, reason: 'loading', source: locale };
  }
  if (entry.status === 'error') {
    return { ok: false, reason: 'error', source: locale };
  }
  var verse = entry.data && entry.data.verses ? entry.data.verses[dataKey] : null;
  if (verse) return { ok: true, data: verse, source: locale };
  return { ok: false, reason: 'unavailable', source: locale };
}

function readMatthewHenryRow(row) {
  var lang = typeof getReaderUiLangCode === 'function' ? getReaderUiLangCode() : 'ko';
  if (!row) return ['', '', ''];
  if (lang === 'en') {

  if (lang === 'ja') {
    return [

      row['日本語訳'] || '',
      row['核心的洞察'] || ''
    ];
  }
  return [
    row['영어원문'] || '',
    row['한국어번역'] || '',
    row['핵심통찰'] || ''
  ];
}

/* v72: 공통 한 손 조작(모바일 pull)을 적용할 전체 화면형 view 판별.

    document.documentElement.classList.toggle('reader-mobile-pull-active', isMobilePullView(viewId));

function updateReaderDockTop() {
  if (!isScriptureDockEnabled()) return;
  try {
    var titleEl = document.getElementById('readerDockTopTitle');
    var viewId = getActiveReaderViewId();
    var title = '성경';

function getBibleListScrollContainer() {
  var main = document.querySelector('main.content');
  if (main) {
    var overflowY = window.getComputedStyle(main).overflowY;
    if ((overflowY === 'auto' || overflowY === 'scroll') && main.scrollHeight > main.clientHeight + 1) {
      return main;
    }
  }
  return document.scrollingElement || document.documentElement;
}

/* v72: 공유 헤더 앞 투명 여유 공간(스페이서)의 실제 높이. 그만큼 스크롤을 내려두면 헤더가 화면 상단에서 시작한다.
   대상이 아닌 화면·데스크톱에서는 스페이서가 display:none 이라 항상 0 을 돌려주어 기존 동작을 그대로 유지한다. */
function getMobileTopPullOffset() {
  try {
    var spacer = document.getElementById('mobileTopPullSpacer');
    if (!spacer) return 0;
    if (window.getComputedStyle(spacer).display === 'none') return 0;
    return spacer.getBoundingClientRect().height || spacer.offsetHeight || 0;
  } catch (e) {
    return 0;
  }
}

function resetBibleListScroll() {
  var scrollEl = getBibleListScrollContainer();
  function scrollToInitial() {
    if (!scrollEl) return;
    // 투명 여유 공간이 활성화된 모바일에서는 여유 공간 높이만큼 내려 헤더가 상단에서 시작하도록 한다 (데스크톱은 offset이 0이라 기존과 동일)
    // sticky 헤더 상태에서 콘텐츠가 헤더 아래로 들어가 겹치지 않도록, 스페이서 오프셋만 정확히 맞춘다.
    scrollEl.scrollTop = getMobileTopPullOffset();
  }
  scrollToInitial();
  // 레이아웃(스페이서 display·높이) 반영 후 한 번 더 맞춰, 진입 직후 0으로 남는 경우를 막는다
  requestAnimationFrame(function() {
    scrollEl = getBibleListScrollContainer();
    scrollToInitial();
    requestAnimationFrame(function() {
      scrollEl = getBibleListScrollContainer();
      scrollToInitial();
    });
  });
}

function dockSwitchTestament(testament) {

  switchTab(testament === 'new' ? 'new' : 'old');

function handleScriptureDock(action) {
  if (!action) return;
  try {
    if (action === 'home') {
      goHome();
      return;
    }
    if (action === 'bible') {
      var viewId = getActiveReaderViewId();
      if (viewId === 'chapterView' || viewId === 'verseView') {
        if (currentBook && currentBook.testament) {
          switchTab(currentBook.testament);
        } else {
          switchTab('old');
        }
        // scrollIntoView(block:start)는 sticky 헤더 위로 첫 분류 제목을 올려 겹침을 만든다.
        // switchTab이 이미 resetBibleListScroll을 호출하므로 추가 스크롤은 하지 않는다.
      } else if (viewId === 'oldView' || viewId === 'newView') {
        // 이미 책 목록이면 스페이서 오프셋만 다시 맞춰 헤더·첫 분류가 겹치지 않게 한다
        resetBibleListScroll();
      } else {
        switchTab(currentTab === 'new' ? 'new' : 'old');
      }
      syncScriptureDockActive('bible');
      return;
    }
    if (action === 'find') {
      switchTab('easy');
      var easyView = document.getElementById('easyView');
      if (easyView) easyView.scrollIntoView({ behavior: 'smooth', block: 'start' });
      syncScriptureDockActive('find');
      return;
    }
    if (action === 'archive') {
      switchTab('fav');
      var favView = document.getElementById('favView');
      if (favView) favView.scrollIntoView({ behavior: 'smooth', block: 'start' });
      syncScriptureDockActive('archive');
      return;
    }

function applyNavigationFromQuery() {
  var p;
  try { p = new URLSearchParams(location.search); } catch (e) { return; }
  var book = (p.get('book') || '').trim();
  var chapterRaw = p.get('chapter');
  var chapterNum = chapterRaw != null && chapterRaw !== '' ? parseInt(chapterRaw, 10) : NaN;

  if (book) {
    var testamentParam = p.get('testament');
    var bookData = null;
    var testament = 'old';
    if (testamentParam === 'new') {
      bookData = findBook(newTestamentData, book);
      testament = 'new';
    } else if (testamentParam === 'old') {
      bookData = findBook(oldTestamentData, book);
      testament = 'old';
    } else {
      bookData = findBook(oldTestamentData, book);
      if (bookData) testament = 'old';
      else {
        bookData = findBook(newTestamentData, book);
        testament = 'new';
      }
    }
    if (!bookData) return;
    currentTab = testament;
    var chCount = getDisplayedChapterCount(bookData);
    if (chapterRaw != null && chapterRaw !== '' && !isNaN(chapterNum) && chapterNum >= 1) {
      currentBook = { name: book, chapters: chCount, testament: testament };
      currentChapter = chapterNum;
      document.querySelectorAll('.view').forEach(function(v) { v.classList.remove('active'); });
      document.getElementById('verseView').classList.add('active');
      var entrySource = p.get('source');
      var isScriptureEntry = entrySource === 'home-daily-read' || entrySource === 'search-related' || entrySource === 'guide-related';
      var verseRaw = p.get('verseStart') || p.get('verse');
      var verseNum = verseRaw != null && verseRaw !== '' ? parseInt(verseRaw, 10) : NaN;
      renderVerses(!isScriptureEntry && !isNaN(verseNum) && verseNum >= 1 ? verseNum : undefined);
      loadCommentaryData();
    } else {
      selectBook(book, chCount, testament);
    }
    updateHeaderBtns(currentTab);
    document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
    var activeTab = document.querySelector('.tab[data-tab="' + currentTab + '"]');
    if (activeTab) activeTab.classList.add('active');
    syncReaderNavActive();
    syncReaderChapterLayout();
    return;
  }

  // ?easy / ?easy=1 / ?easy=1&cb=... 모두 인식 (정확 문자열 비교 금지)
  if (p.has('easy')) {
    try { renderEasyFind(); } catch (e) {}
    switchTab('easy');
    syncScriptureDockActive('find');
    syncReaderNavActive();
    try { resetBibleListScroll(); } catch (e2) {}
    return;
  }
  if (p.has('favorites')) {
    switchTab('fav');
    syncReaderNavActive();
    return;
  }

  var qRaw = (p.get('q') || '').trim();
  if (qRaw) {
    var si = document.getElementById('searchInput');
    if (si) si.value = qRaw;
    var siNew = document.getElementById('searchInputReader');
    if (siNew) siNew.value = qRaw;
    var searchRestorePending = readSearchReturnPending();
    if (searchRestorePending && searchRestorePending.bodyVisibleCount) {
      _searchBodyVisibleCount = searchRestorePending.bodyVisibleCount;
    }
    switchTab('search');
    doSearch(searchRestorePending ? false : undefined);
    if (searchRestorePending) {
      restoreSearchReturnScroll(searchRestorePending);
      clearSearchReturnState();
    }
    syncReaderNavActive();
    return;
  }
  if (p.get('focus') === 'search') {
    switchTab('search');
    syncReaderNavActive();
    return;
  }
  var testamentOnly = p.get('testament');
  if (testamentOnly === 'old' || testamentOnly === 'new') {
    switchTab(testamentOnly);
    syncReaderNavActive();
  }
}

function runDeferredUrlNavigation() {
  function run() {
    try { applyNavigationFromQuery(); } catch (e) { document.documentElement.classList.remove('search-entry-pending'); }
    function finishRun() {
      if (document.documentElement.classList.contains('scripture-entry-pending') && typeof window.__gomnaRevealScriptureEntry === 'function') {
        window.__gomnaRevealScriptureEntry();
      }
      syncReaderNavActive();
    }
    if (typeof requestAnimationFrame === 'function') {
      requestAnimationFrame(finishRun);
    } else {
      finishRun();
    }
  }
  if (typeof requestAnimationFrame === 'function') {
    requestAnimationFrame(function() { setTimeout(run, 0); });
  } else {
    setTimeout(run, 0);
  }
}

/** Normalize en-US / ja-JP / ko-KR → en / ja / ko. Unknown codes → null. */
function normalizeReaderLangCode(code) {
  if (!code) return null;
  var c = String(code).toLowerCase().replace(/_/g, '-');
  if (c === 'ko' || c.indexOf('ko-') === 0) return 'ko';
  if (c === 'en' || c.indexOf('en-') === 0) return 'en';
  if (c === 'ja' || c.indexOf('ja-') === 0) return 'ja';
  return null;
}

function getRawGoogTransTarget() {
  try {
    var m = (document.cookie || '').match(/(?:^|;\s*)googtrans=([^;]+)/);
    if (!m) return null;
    return decodeURIComponent(m[1]).split('/')[2] || null;
  } catch (e) {
    return null;
  }
}

function getGoogTeComboLangRaw() {
  try {
    var sel = document.querySelector('select.goog-te-combo');
    if (sel && sel.value) return sel.value;

  return null;
}

/**
 * Reader UI lang for ko/en/ja native chapter/toolbar labels.
 * Other Google langs return null (keep Korean source for Google).
 * App selection (gomna_ui_language) is the authority for ko/en/ja so
 * audio locale and on-screen language stay in sync on iPhone.
 */
function getReaderUiLangCode() {
  /* Optimistic bridge selection wins during in-flight KO↔EN/JA switches. */
  try {
    var displayPending = window.__gomnaBridgeDisplayLang;
    if (displayPending) {
      var displayNorm = normalizeReaderLangCode(displayPending);
      if (displayNorm === 'ko' || displayNorm === 'en' || displayNorm === 'ja') {
        return displayNorm;
      }
    }
  } catch (eDisp) { /* ignore */ }
  var storedNorm = null;
  try {
    storedNorm = normalizeReaderLangCode(localStorage.getItem('gomna_ui_language'));
  } catch (e2) { /* ignore */ }
  if (storedNorm === 'ko' || storedNorm === 'en' || storedNorm === 'ja') {
    return storedNorm;
  }

  var rawCookie = getRawGoogTransTarget();
  var rawCombo = getGoogTeComboLangRaw();
  var cookieNorm = normalizeReaderLangCode(rawCookie);
  var comboNorm = normalizeReaderLangCode(rawCombo);
  if (rawCookie && !cookieNorm) return null;
  var translated = false;
  try {
    var html = document.documentElement;
    translated = !!(html && (html.classList.contains('translated-ltr') || html.classList.contains('translated-rtl')));
  } catch (e0) { /* ignore */ }
  if (translated && rawCombo && !comboNorm) return null;

  if (translated) {
    if (comboNorm) return comboNorm;
    if (cookieNorm) return cookieNorm;
  }
  if (cookieNorm === 'en' || cookieNorm === 'ja') return cookieNorm;
  if (cookieNorm === 'ko') return 'ko';
  return 'ko';
}

function isReaderNativeUiLang(lang) {
  return lang === 'ko' || lang === 'en' || lang === 'ja';

function syncReaderNativeUiLangClass() {
  var root = document.documentElement;

  root.classList.remove('gomna-reader-ui-ko', 'gomna-reader-ui-en', 'gomna-reader-ui-ja');

  if (opts.current && opts.currentClass) cls += ' ' + opts.currentClass;

  if (native) html += ' class="notranslate" translate="no" lang="' + lang + '"';
  html += '>' + label + '</span></button>';

}

function applyReaderChapterLabels(root) {
  if (!root || !root.querySelectorAll) return;
  var lang = getReaderUiLangCode();
  if (!isReaderNativeUiLang(lang)) return;
  syncReaderNativeUiLangClass();
  var bookName = (currentBook && currentBook.name) || '';
  var nodes = root.querySelectorAll('[data-reader-chapter-number]');
  for (var i = 0; i < nodes.length; i++) {
    var el = nodes[i];
    var n = parseInt(el.getAttribute('data-reader-chapter-number'), 10);
    if (!n || isNaN(n)) continue;
    var want = formatReaderChapterLabel(n, lang, bookName);
    var labelEl = el.querySelector(':scope > span') || el.querySelector('span') || el;
    /* textContent clears Google <font> wrappers without changing button/onclick */
    if ((labelEl.textContent || '') !== want) labelEl.textContent = want;
    if (!el.classList.contains('notranslate')) el.classList.add('notranslate');
    if (el.getAttribute('translate') !== 'no') el.setAttribute('translate', 'no');
    if (el.getAttribute('lang') !== lang) el.setAttribute('lang', lang);
    if (labelEl !== el) {
      if (!labelEl.classList.contains('notranslate')) labelEl.classList.add('notranslate');
      if (labelEl.getAttribute('translate') !== 'no') labelEl.setAttribute('translate', 'no');
      if (labelEl.getAttribute('lang') !== lang) labelEl.setAttribute('lang', lang);
    }
  }
}

var _readerChapterLabelObserverRoot = null;

function disconnectReaderChapterLabelObserver() {
  if (_readerChapterLabelObserver) {
    try { _readerChapterLabelObserver.disconnect(); } catch (e) { /* ignore */ }
    _readerChapterLabelObserver = null;
    _readerChapterLabelObserverRoot = null;
  }
}

function connectReaderChapterLabelObserver(root) {
  if (!root || typeof MutationObserver === 'undefined') return;
  if (_readerChapterLabelObserver && _readerChapterLabelObserverRoot === root) return;
  disconnectReaderChapterLabelObserver();
  var scheduled = false;
  _readerChapterLabelObserverRoot = root;
  _readerChapterLabelObserver = new MutationObserver(function() {
    if (scheduled) return;
    scheduled = true;
    requestAnimationFrame(function() {
      scheduled = false;
      var obs = _readerChapterLabelObserver;
      var target = _readerChapterLabelObserverRoot;
      if (!obs || !target) return;
      obs.disconnect();
      try {
        applyReaderChapterLabels(target);
      } finally {
        if (_readerChapterLabelObserver === obs && _readerChapterLabelObserverRoot === target) {
          obs.observe(target, { subtree: true, characterData: true, childList: true });
        }
      }
    });
  });
  _readerChapterLabelObserver.observe(root, { subtree: true, characterData: true, childList: true });
}

  function getLang() {
    if (typeof getReaderUiLangCode === 'function') return getReaderUiLangCode();
    return 'ko';
  }

  function isNativeLang(lang) {
    var code = lang || getLang();
    return code === 'ko' || code === 'en' || code === 'ja';
  }

  function t(key) {
    var lang = getLang();
    var pack = isNativeLang(lang) ? STRINGS[lang] : STRINGS.ko;
    if (pack && pack[key] != null) return pack[key];
    if (STRINGS.ko[key] != null) return STRINGS.ko[key];
    return key;
  }

  function formatSubtitle(lang) {
    var code = lang || getLang();
    var base = t('commentary.subtitle');
    if (code === 'ko') return ' (' + base + ')';
    return ' · ' + base;
  }

  function formatRef(koreanReference) {
    if (!koreanReference) return koreanReference;
    var lang = getLang();
    if (!isNativeLang(lang) || lang === 'ko') return koreanReference;
    if (typeof window.GomnaTranslateBookRef === 'function') {
      return window.GomnaTranslateBookRef(koreanReference, lang);
    }
    return koreanReference;
  }

  function setAttrIfChanged(el, name, value) {
    if (!el) return;
    if (value == null || value === '') {
      if (el.hasAttribute(name)) el.removeAttribute(name);
      return;
    }
    if (el.getAttribute(name) !== String(value)) el.setAttribute(name, value);
  }

  function setTextIfChanged(el, text) {
    if (!el) return;
    if ((el.textContent || '') !== text) el.textContent = text;
  }

  function lockLeaf(el, key, lang) {
    if (!el) return;
    var code = lang || getLang();
    if (key) setAttrIfChanged(el, 'data-gomna-commentary-i18n', key);
    if (!isNativeLang(code)) {
      if (el.getAttribute('data-gomna-commentary-native-lock') === '1') {
        el.classList.remove('notranslate');
        if (el.getAttribute('translate') === 'no') el.removeAttribute('translate');
        el.removeAttribute('lang');
        el.removeAttribute('data-gomna-commentary-native-lock');
      }
      return;
    }
    if (!el.classList.contains('notranslate')) el.classList.add('notranslate');
    setAttrIfChanged(el, 'translate', 'no');
    setAttrIfChanged(el, 'lang', code);
    setAttrIfChanged(el, 'data-gomna-commentary-native-lock', '1');
  }

  function applyReference(element, koreanReference) {
    if (!element || !koreanReference) return;
    var display = formatRef(koreanReference);
    setAttrIfChanged(element, 'data-commentary-source-ref', koreanReference);
    if (element.tagName === 'TR' || element.hasAttribute('data-verse-ref')) {
      /* Card badge uses CSS attr(data-verse-ref); never lock the whole row. */
      setAttrIfChanged(element, 'data-verse-ref', display);
      return;
    }
    setTextIfChanged(element, display);
    lockLeaf(element, 'commentary.ref', getLang());
  }

  function applyColumnCssVars(root) {
    var host = root || document.getElementById('commentaryPopup');
    if (!host || !host.style) return;
    var lang = getLang();
    var native = isNativeLang(lang);
    var i;
    var pair;
    var text;
    for (i = 0; i < COL_CSS_VARS.length; i++) {
      pair = COL_CSS_VARS[i];
      text = native ? t(pair[1]) : STRINGS.ko[pair[1]];
      host.style.setProperty(pair[0], JSON.stringify(String(text)));
    }
  }

  function applyKeyedLeaves(root) {
    if (!root || !root.querySelectorAll) return;
    var lang = getLang();
    var nodes = root.querySelectorAll('[data-gomna-commentary-i18n]');
    var i;
    var el;
    var key;
    var want;
    for (i = 0; i < nodes.length; i++) {
      el = nodes[i];
      key = el.getAttribute('data-gomna-commentary-i18n');
      if (!key || key === 'commentary.ref') continue;
      if (key === 'commentary.subtitle') {
        want = formatSubtitle(lang);
      } else if (key.indexOf('commentary.audio.') === 0 || key === 'commentary.close') {
        /* Dynamic audio labels are owned by the audio module; only refresh lock/attrs. */
        lockLeaf(el, key, lang);
        continue;
      } else {
        want = t(key);
      }
      if (el.childElementCount === 0) {
        setTextIfChanged(el, want);
      }
      lockLeaf(el, key, lang);
    }
  }

  function applyVerseRefBadges(root) {
    if (!root || !root.querySelectorAll) return;
    var nodes = root.querySelectorAll('[data-commentary-source-ref]');
    var i;
    var el;
    var source;
    for (i = 0; i < nodes.length; i++) {
      el = nodes[i];
      source = el.getAttribute('data-commentary-source-ref');
      if (!source) continue;
      applyReference(el, source);
    }
  }

  function applyHeader(root) {
    var scope = root || document;
    var title = scope.querySelector ? scope.querySelector('#commentaryTitle') : document.getElementById('commentaryTitle');
    if (!title) return;
    var mainTitle = title.querySelector('strong');
    var description = title.querySelector('.commentary-compact-description');
    var refLine = title.querySelector('.commentary-compact-ref');
    var lang = getLang();
    if (mainTitle) {
      setTextIfChanged(mainTitle, t('commentary.title'));
      lockLeaf(mainTitle, 'commentary.title', lang);
    }
    if (description) {
      setTextIfChanged(description, formatSubtitle(lang));
      lockLeaf(description, 'commentary.subtitle', lang);
    }
    if (refLine) {
      var source = refLine.getAttribute('data-commentary-source-ref') || (refLine.textContent || '').trim();
      if (source) applyReference(refLine, source);
    }
  }

  function apply(root) {
    var popup = document.getElementById('commentaryPopup');
    if (!popup || !popup.classList.contains('show')) return;
    var scope = root || popup;
    applyColumnCssVars(popup);
    applyHeader(popup);
    applyKeyedLeaves(scope);
    applyVerseRefBadges(scope);
  }

  function leafAttrs(key) {
    var lang = getLang();
    var native = isNativeLang(lang);
    var html = ' data-gomna-commentary-i18n="' + key + '"';
    if (native) {
      html += ' translate="no" lang="' + lang + '" data-gomna-commentary-native-lock="1" class="notranslate"';
    }
    return html;
  }

  function leafHtml(key, text) {
    return '<span' + leafAttrs(key) + '>' + text + '</span>';
  }

  window.GomnaCommentaryI18n = {
    getLang: getLang,
    isNativeLang: isNativeLang,
    t: t,
    apply: apply,
    applyReference: applyReference,
    formatRef: formatRef,
    formatSubtitle: formatSubtitle,
    leafAttrs: leafAttrs,
    leafHtml: leafHtml,
    lockLeaf: lockLeaf,
    applyColumnCssVars: applyColumnCssVars
  };
})();

function commentaryI18nT(key) {
  return window.GomnaCommentaryI18n ? window.GomnaCommentaryI18n.t(key) : key;
}

function commentaryI18nLeafAttrs(key) {
  return window.GomnaCommentaryI18n ? window.GomnaCommentaryI18n.leafAttrs(key) : '';
}

var easyFindBrowseMode = 'category';
var easyGanadaBubbleTimer = null;
var easyGanadaActiveCons = 'all';
var easyGanadaComposing = false;

function getEasyFindConsonant(str) {
  var c = getInitialConsonant(str);
  if (c === 'ㄲ') return 'ㄱ';
  if (c === 'ㄸ') return 'ㄷ';
  if (c === 'ㅃ') return 'ㅂ';
  if (c === 'ㅆ') return 'ㅅ';
  if (c === 'ㅉ') return 'ㅈ';
  return c;
}

function placeEasyFilteredBooksAfter(targetElement) {
  var host = document.getElementById('filteredBooks');
  if (!host || !targetElement || !targetElement.parentNode) return;
  if (host === targetElement) return;
  if (targetElement.nextElementSibling === host) return;
  targetElement.parentNode.insertBefore(host, targetElement.nextSibling);
}

function ensureEasyCategoryResultVisible() {
  var host = document.getElementById('filteredBooks');
  if (!host) return;
  var title = host.querySelector('.filtered-title') || host;
  var scrollEl = typeof getBibleListScrollContainer === 'function'
    ? getBibleListScrollContainer()
    : (document.scrollingElement || document.documentElement);
  if (!scrollEl) return;
  var rect = title.getBoundingClientRect();
  var dock = document.getElementById('scriptureDock');
  var dockH = 0;
  try {
    if (dock && window.getComputedStyle(dock).display !== 'none') {
      dockH = dock.getBoundingClientRect().height || 0;
    }
  } catch (e) {}
  var visibleBottom = window.innerHeight - dockH - 8;
  if (rect.top < visibleBottom) return;
  var delta = rect.top - (visibleBottom - 52);
  if (delta <= 0) return;
  try {
    scrollEl.scrollBy({ top: delta, behavior: 'smooth' });
  } catch (e) {
    scrollEl.scrollTop += delta;
  }
}

function setEasyFindBrowseMode(mode) {
  if (mode !== 'ganada' && mode !== 'category') return;
  var easyView = document.getElementById('easyView');
  if (!easyView) return;
  easyFindBrowseMode = mode;
  easyView.querySelectorAll('.easy-mode-seg-btn').forEach(function(btn) {
    var on = btn.getAttribute('data-easy-mode') === mode;
    btn.classList.toggle('is-active', on);
    btn.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  if (mode === 'ganada') {
    easyView.classList.add('easy-view--ganada');
    easyView.classList.remove('easy-view--filtered');
    var host = document.getElementById('filteredBooks');
    if (host) host.innerHTML = '';
    easyGanadaActiveCons = 'all';
    easyGanadaComposing = false;
    var input = document.getElementById('easyBookSearchInput');
    if (input) input.value = '';
    syncEasyBookSearchClear();
    showEasyGanadaChrome();
    renderEasyGanadaQuick();
    renderEasyGanadaList();
    try { resetBibleListScroll(); } catch (e) {}
    return;
  }
  easyView.classList.remove('easy-view--ganada');
  hideEasyGanadaChrome();
  var activeCat = easyView.querySelector('.easy-category-block .consonant-btn.cat-btn.active');
  var allBtn = document.getElementById('readerDockTopAllBooks');
  if (activeCat) {
    var keySpan = activeCat.querySelector('[data-i18n-cat-name]');
    var key = keySpan && keySpan.getAttribute('data-i18n-cat-name');
    if (key) filterByCategory(key, activeCat);
    else showAllBooks(allBtn);
  } else {
    showAllBooks(allBtn);
  }
}

function leaveEasyGanadaModeChrome() {
  if (easyFindBrowseMode !== 'ganada') return;
  easyFindBrowseMode = 'category';
  var easyView = document.getElementById('easyView');
  if (!easyView) return;
  easyView.classList.remove('easy-view--ganada');
  hideEasyGanadaChrome();

  });
}

function buildEasyBookCardHtml(b) {
  var bookTestCls = b.testament === 'old' ? ' easy-book--old' : ' easy-book--new';
  return '<button class="book-btn' + bookTestCls + '" onclick="selectBook(\'' + b.name + '\',' + b.chapters + ',\'' + b.testament + '\')"><div class="name">' + b.name + '</div><div class="chapters">' + b.chapters + getChapterUnit(b.name) + '</div></button>';
}

function normalizeEasyBookSearchQuery(q) {
  return String(q || '').trim().replace(/\s+/g, '');
}

function getEasyGanadaGroupData() {
  var order = ['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  var groups = {};
  order.forEach(function(c) { groups[c] = []; });
  getAllBooks().forEach(function(b) {
    var c = getEasyFindConsonant(b.name);
    if (groups[c]) groups[c].push(b);
  });
  order.forEach(function(c) {
    groups[c].sort(function(a, b) {
      return String(a.name).localeCompare(String(b.name), 'ko');
    });
  });
  return {
    order: order,
    groups: groups,
    present: order.filter(function(c) { return groups[c].length > 0; })
  };
}

function syncEasyBookSearchClear() {
  var input = document.getElementById('easyBookSearchInput');
  var clear = document.getElementById('easyBookSearchClear');
  if (!clear) return;
  clear.hidden = !(input && String(input.value || '').length > 0);
}

function renderEasyGanadaQuick() {

  });
  quick.innerHTML = html;

  var q = normalizeEasyBookSearchQuery(
    (document.getElementById('easyBookSearchInput') || {}).value || ''
  );
  if (q) setEasyGanadaQuickActive(null);
  else setEasyGanadaQuickActive(easyGanadaActiveCons || 'all');

function renderEasyGanadaList() {
  var root = document.getElementById('easyGanadaRoot');
  if (!root) return;
  var input = document.getElementById('easyBookSearchInput');
  var raw = input ? String(input.value || '') : '';
  var q = normalizeEasyBookSearchQuery(raw);
  var html = '';
  if (q) {
    setEasyGanadaQuickActive(null);
    var books = getAllBooks().filter(function(b) {
      return normalizeEasyBookSearchQuery(b.name).indexOf(q) !== -1;
    });
    books.sort(function(a, b) {
      return String(a.name).localeCompare(String(b.name), 'ko');
    });
    var displayQ = String(raw).trim();
    if (!books.length) {
      html = '<div class="empty-state"><div class="msg">해당 이름의 성경책이 없습니다</div></div>';
    } else {
      html = '<div class="filtered-title" translate="no">' + _escR('"' + displayQ + '" 검색 결과 (' + books.length + ')') + '</div>';
      html += '<div class="book-grid">';
      books.forEach(function(b) { html += buildEasyBookCardHtml(b); });
      html += '</div>';
    }
  } else {
    var data = getEasyGanadaGroupData();
    var cons = easyGanadaActiveCons || 'all';
    setEasyGanadaQuickActive(cons);
    if (cons !== 'all') {
      var list = data.groups[cons] || [];

function findCommentaryFile(folder, bookName, chapter) {
  var possibleFiles = [];
  for(var i = 1; i <= 50; i++) {
    possibleFiles.push(folder + '/' + bookName.substring(0,2) + '_' + bookName + '_ch' + i + '_' + (i+5) + '.json');
    possibleFiles.push(folder + '/01_' + bookName + '_ch' + i + '_' + (i+5) + '.json');
    possibleFiles.push(folder + '/' + bookName + '_' + i + '장~' + (i+5) + '장.json');
  }
  
  var xhr = new XMLHttpRequest();
  xhr.open('GET', folder + '/', false);
  try {
    xhr.send();
    if(xhr.status === 200) {
      var files = xhr.responseText.match(/href="([^"]+\.json)"/g);
      if(files) {
        files.forEach(function(f) {
          var fileName = f.replace('href="', '').replace('"', '');
          fetch(folder + '/' + fileName)
            .then(function(r) { return r.json(); })
            .then(function(data) {
              if(data.chapters) {
                data.chapters.forEach(function(ch) {
                  var key = bookName + '_' + ch.chapter;
                  commentaryCache[key] = ch.verses;
                });
              }
            })
            .catch(function() {});
        });
      }
    }
  } catch(e) {}
}

function getTotalVersesInChapter(bookName, chapter) {

  var maxVerse = 0;
  if(window.pastorCommentaryData) {

      if(key.startsWith(bookName + '_' + chapter + '_')) {
        var parts = key.split('_');

  // pastorCommentaryData에 없으면 현재 표시된 절 데이터 사용
  if(maxVerse === 0 && window.versesData) {

function getKoreanBibleVerseText(bookName, chapter, verseNum) {
  var sources = [];

  if(typeof oldTestamentData !== 'undefined' && oldTestamentData && oldTestamentData.books) {
    sources.push(oldTestamentData);
  }

  if(typeof newTestamentData !== 'undefined' && newTestamentData && newTestamentData.books) {
    sources.push(newTestamentData);
  }

  for(var sourceIndex=0; sourceIndex<sources.length; sourceIndex++) {
    var books = sources[sourceIndex].books;

    for(var bookIndex=0; bookIndex<books.length; bookIndex++) {
      var book = books[bookIndex];
      if(!book || book.name !== bookName) continue;

      for(var chapterIndex=0; chapterIndex<book.chapters.length; chapterIndex++) {
        var chapterData = book.chapters[chapterIndex];
        if(!chapterData || parseInt(chapterData.chapter, 10) !== chapter) continue;

        for(var verseIndex=0; verseIndex<chapterData.verses.length; verseIndex++) {
          var verseData = chapterData.verses[verseIndex];

          if(verseData && parseInt(verseData.verse, 10) === verseNum) {
            return String(verseData.text || '').trim();
          }
        }
      }
    }
  }

  return '';
}

function getLocaleCardVerseText(bookName, chapter, verseNum) {
  var locale = getCommentaryCardLocale();
  var bookId;
  var entry;
  var key;
  var verse;
  var text;

  if (locale === 'ko-KR') return '';
  bookId = BOOK_FILE_MAP[bookName];
  if (!bookId) return '';
  entry = peekLocaleCommentaryCards(locale, bookId);
  if (!entry || entry.status !== 'ready' || !entry.data || !entry.data.verses) return '';
  key = bookName + '_' + chapter + '_' + verseNum;
  verse = entry.data.verses[key];
  if (!verse) return '';
  text = String(verse.verseText || '').trim();
  return text;
}

function ensureCommentaryScrollShell() {

  var header = document.getElementById('popupDragHeader');
  var content = document.getElementById('commentaryContent');

  var spacer;
  var pullSpacer;
  var child;
  var next;
  var footerLike;
  var insertBeforeNode;

      scroll.className = 'gomna-commentary-scroll-area';
      insertBeforeNode =
        (header.parentNode === box && header) ||
        (content.parentNode === box && content) ||
        box.firstChild;
      box.insertBefore(scroll, insertBeforeNode);
    }

    if (header.parentNode !== scroll) scroll.appendChild(header);
    if (content.parentNode !== scroll) scroll.appendChild(content);

    /* Real empty space above header — pull-down grows this height (no transform). */
    pullSpacer = document.getElementById('commentaryHeaderPullSpacer');

      pullSpacer = document.createElement('div');

    spacer = document.getElementById('commentaryScrollSpacer');
    if (!spacer) {
      spacer = document.createElement('div');
      spacer.id = 'commentaryScrollSpacer';
      spacer.className = 'gomna-commentary-scroll-spacer';

    }
    if (spacer.parentNode !== scroll) scroll.appendChild(spacer);

    child = scroll.firstElementChild;

      next = child.nextElementSibling;

        child.id === 'gomnaCommentaryInlineControls' ||
        (child.classList && (
          child.classList.contains('gomna-audio-commentary-controls-footer') ||

          child.classList.contains('gomna-commentary-legacy-close-wrap')

    }

      ':scope > #gomnaCommentaryInlineControls, :scope > .gomna-commentary-inline-controls, :scope > .gomna-audio-commentary-controls-footer, :scope > .gomna-commentary-legacy-close-wrap'
    )).forEach(function(el) {
      var n = scroll.nextElementSibling;
      var afterScroll = false;
      while (n) {
        if (n === el) { afterScroll = true; break; }

      }

    });

}

function switchCommentaryTab(btn, tabId) {
  var type =
    (btn && btn.getAttribute && btn.getAttribute('data-gomna-commentary-type')) ||
    commentaryTypeForTabId(tabId) ||
    '';
  var resolvedTabId = tabId || commentaryTabIdForType(type) || currentCommentaryTab;
  var tabs;
  var contents;
  var target;
  var i;

  currentCommentaryType = type;
  currentCommentaryTab = resolvedTabId;

  if (btn && currentCommentaryType && !btn.getAttribute('data-gomna-commentary-type')) {
    btn.setAttribute('data-gomna-commentary-type', currentCommentaryType);
  }
  if (btn && resolvedTabId && !btn.getAttribute('data-gomna-commentary-tab-id')) {
    btn.setAttribute('data-gomna-commentary-tab-id', resolvedTabId);
  }

  // Selection UI first — never gated by audio/manifest readiness.
  tabs = document.querySelectorAll('.commentary-tab');
  for (i = 0; i < tabs.length; i++) {
    if (tabs[i].getAttribute('data-gomna-commentary-sequence-button') === 'true') continue;
    tabs[i].classList.remove('active');
    tabs[i].disabled = false;
    tabs[i].removeAttribute('aria-disabled');
  }
  if (btn) {
    btn.classList.add('active');
    btn.disabled = false;
    btn.removeAttribute('aria-disabled');
  } else if (type) {
    btn = document.querySelector('.commentary-tab[data-gomna-commentary-type="' + type + '"]');
    if (btn) btn.classList.add('active');
  }

  contents = document.querySelectorAll('.tab-content');
  for (i = 0; i < contents.length; i++) {
    contents[i].classList.remove('active');
    contents[i].style.display = 'none';
  }

  // Prefer stable type attribute; fall back to panel id. Never match visible labels.
  target =
    (type && document.querySelector('#commentaryContent .tab-content[data-gomna-commentary-type="' + type + '"]')) ||
    (resolvedTabId && document.getElementById(resolvedTabId)) ||
    null;
  if (target) {
    if (type && !target.getAttribute('data-gomna-commentary-type')) {
      target.setAttribute('data-gomna-commentary-type', type);
    }
    target.classList.add('active');
    target.style.display = 'block';
  }

  if (typeof window.__gomnaCommentaryOnTypeSelected === 'function') {
    window.__gomnaCommentaryOnTypeSelected(currentCommentaryType, resolvedTabId);
  }
  if (typeof window.__gomnaCommentaryGestureOnTabChange === 'function') {
    window.__gomnaCommentaryGestureOnTabChange();
  }
}


function loadCommentaryForVerse(bookName, chapter, verse) {
  var bookNum = bookNumbers[bookName];
  if(!bookNum) return;
  
  var chapterStr = String(chapter).padStart(3, '0');
  var dataKey = bookNum + '_' + bookName + '_' + chapterStr + '장';
  
  // 메모리에서 주석 데이터 로드
  if(typeof commentaryData !== 'undefined' && commentaryData[dataKey]) {
    var data = commentaryData[dataKey];
    if(data && data.verses) {
      commentaryCache[bookName + '_' + chapter] = data.verses;
      showCommentary(verse);
    }
  } else {
    // 데이터 없음 표시
    document.getElementById('commentaryContent').innerHTML = '<div class="empty-state"><div class="msg">이 구절의 주석 데이터가 없습니다.</div></div>';
  }
}

function escapeHtmlText(value) {
  return String(value == null ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function findBookDataByBookId(bookId) {
  var koName =
    window.GomnaBibleRef && typeof window.GomnaBibleRef.getKoreanBookName === 'function'
      ? window.GomnaBibleRef.getKoreanBookName(bookId)
      : null;
  if (!koName) return null;
  if (typeof findBook === 'function') {
    return findBook(oldTestamentData, koName) || findBook(newTestamentData, koName);
  }
  var sources = [oldTestamentData, newTestamentData];
  for (var s = 0; s < sources.length; s += 1) {
    var data = sources[s];
    if (!data || !data.books) continue;
    for (var i = 0; i < data.books.length; i += 1) {
      if (data.books[i].name === koName) return data.books[i];
    }
  }
  return null;
}

function buildStructuredVerseLink(displayText) {
  var display = String(displayText == null ? '' : displayText).trim();
  if (!display) return '';
  var parsed =
    window.GomnaBibleRef && typeof window.GomnaBibleRef.parseBibleReference === 'function'
      ? window.GomnaBibleRef.parseBibleReference(display)
      : null;
  var safeDisplay = escapeHtmlText(display);
  if (!parsed || !parsed.ok) {
    return (
      '<span onclick="showVersePopup(' +
      JSON.stringify(display) +
      ')" style="color:#1565C0; text-decoration:underline; cursor:pointer;">' +
      safeDisplay +
      '</span>'
    );
  }
  return (
    '<span class="gomna-bible-ref-link" role="link" tabindex="0"' +
    ' data-book-id="' +
    escapeHtmlText(parsed.bookId) +
    '"' +
    ' data-chapter="' +
    escapeHtmlText(String(parsed.chapter)) +
    '"' +
    ' data-verse-start="' +
    escapeHtmlText(String(parsed.verseStart)) +
    '"' +
    ' data-verse-end="' +
    escapeHtmlText(String(parsed.verseEnd == null ? parsed.verseStart : parsed.verseEnd)) +
    '"' +
    ' data-range-text="' +
    escapeHtmlText(parsed.rangeText == null ? '' : String(parsed.rangeText)) +
    '"' +
    ' data-display="' +
    escapeHtmlText(parsed.display) +
    '"' +
    ' onclick="showVersePopupFromElement(this)"' +
    ' style="color:#1565C0; text-decoration:underline; cursor:pointer;">' +
    safeDisplay +
    '</span>'
  );
}

    chapter: el.getAttribute('data-chapter'),
    verseStart: el.getAttribute('data-verse-start'),
    verseEnd: el.getAttribute('data-verse-end'),
    rangeText: el.getAttribute('data-range-text'),
    display: el.getAttribute('data-display') || el.textContent,

}

function showVersePopupFromStructured(ref) {
  if (!ref || !ref.bookId) {
    document.getElementById('commentaryContent').innerHTML =
      '<p style="color:#c00; margin:8px 0;">구절 형식 오류</p>';
    return;
  }
  var chapter = parseInt(ref.chapter, 10);
  var verseStart = parseInt(ref.verseStart, 10);
  var verseEnd =
    ref.verseEnd == null || ref.verseEnd === ''
      ? verseStart
      : parseInt(ref.verseEnd, 10);
  if (!Number.isInteger(chapter) || chapter < 1 || !Number.isInteger(verseStart) || verseStart < 1) {
    document.getElementById('commentaryContent').innerHTML =
      '<p style="color:#c00; margin:8px 0;">구절 형식 오류: ' +
      escapeHtmlText(ref.display || '') +
      '</p>';
    return;
  }
  if (!Number.isInteger(verseEnd) || verseEnd < verseStart) verseEnd = verseStart;

  var bookData = findBookDataByBookId(ref.bookId);
  var koBookName =
    (window.GomnaBibleRef && window.GomnaBibleRef.getKoreanBookName(ref.bookId)) ||
    ref.bookId;
  var rangeLabel =
    ref.rangeText && String(ref.rangeText).trim()
      ? String(ref.rangeText).trim()
      : verseEnd > verseStart
        ? verseStart + '-' + verseEnd
        : String(verseStart);

// 텍스트에서 성경구절을 자동 감지하여 클릭 가능한 링크로 변환
function parseBibleRefs(text) {
  if(!text) return '';

  // Prefer structured resolver when the whole cell is a single/multi ref list.
  if (window.GomnaBibleRef && typeof window.GomnaBibleRef.parseBibleReferenceList === 'function') {
    var list = window.GomnaBibleRef.parseBibleReferenceList(text);
    var allOk = list.length > 0 && list.every(function (item) { return item && item.ok; });
    if (allOk && list.length <= 4) {
      return list.map(function (item) { return buildStructuredVerseLink(item.display); }).join(', ');
    }
  }

  // 성경 약어 패턴 (구약+신약) — legacy inline detection for mixed prose
  var bookPattern = '창세기|출애굽기|레위기|민수기|신명기|여호수아|사사기|룻기|사무엘상|사무엘하|열왕기상|열왕기하|역대상|역대하|에스라|느헤미야|에스더|욥기|시편|잠언|전도서|아가|이사야|예레미야|예레미야애가|에스겔|다니엘|호세아|요엘|아모스|오바댜|요나|미가|나훔|하박국|스바냐|학개|스가랴|말라기|마태복음|마가복음|누가복음|요한복음|사도행전|로마서|고린도전서|고린도후서|갈라디아서|에베소서|빌립보서|골로새서|데살로니가전서|데살로니가후서|디모데전서|디모데후서|디도서|빌레몬서|히브리서|야고보서|베드로전서|베드로후서|요한일서|요한이서|요한삼서|유다서|요한계시록|창|출|레|민|신|수|삿|룻|삼상|삼하|왕상|왕하|대상|대하|스|느|에|욥|시|잠|전|아|사|렘|애|겔|단|호|욜|암|옵|욘|미|나|합|습|학|슥|말|마|막|눅|요|행|롬|고전|고후|갈|엡|빌|골|살전|살후|딤전|딤후|딛|몬|히|약|벧전|벧후|요일|요이|요삼|유|계';

  // 패턴1: 책이름 장:절 (예: 요1:1, 요 1:1-3, 골1:16)
  var regex1 = new RegExp('((' + bookPattern + ')\\s*(\\d+):(\\d+(?:-\\d+)?))', 'g');

  // 패턴2: 책이름 장장 (예: 창5장, 욥38장)
  var regex2 = new RegExp('((' + bookPattern + ')\\s*(\\d+)(장|편))', 'g');

  // 먼저 장:절 패턴 처리
  text = text.replace(regex1, function(match) {
    return buildStructuredVerseLink(match);
  });

  // 그 다음 장장 패턴 처리 (이미 링크된 부분은 제외)
  text = text.replace(regex2, function(match) {
    if (match.indexOf('gomna-bible-ref-link') >= 0 || match.indexOf('onclick') >= 0) return match;
    return buildStructuredVerseLink(match);
  });

  return text;
}

// 드래그 기능 (말씀풀이 + 절 범위 모달)
// - 데스크톱/레거시: left/top 드래그
// - 아이폰: spacer 높이 1:1 당김 (rAF 1회/프레임, touchmove 중 layout 재측정 없음)
(function() {
  var dragState = null;
  var headerDrag = null;
  var pullRafId = 0;
  var pullDragGen = 0;
  var HEADER_THRESHOLD_PX = 4;
  var FOOTER_GAP_PX = 16;
  var suppressHeaderClickOnce = false;
  var pullMetrics = { maxSpace: 0, safeBottom: 0, ready: false };

  function clampBox(box, left, top) {
    var w = box.offsetWidth;
    var h = box.offsetHeight;
    var minL = 50 - w;
    var maxL = window.innerWidth - 50;
    var minT = 50 - h;
    var maxT = window.innerHeight - 50;
    left = Math.max(minL, Math.min(maxL, left));
    top = Math.max(minT, Math.min(maxT, top));
    return { left: left, top: top };
  }

  function usesMobileCommentaryHeaderDrag() {
    if (!document.getElementById('commentaryScrollArea')) return false;
    if (!document.body.classList.contains('gomna-commentary-popup-open')) return false;
    if (typeof shouldUseUnifiedCommentaryScroll === 'function') {
      try { if (!shouldUseUnifiedCommentaryScroll()) return false; } catch (eUse) { return false; }
    }
    return true;
  }

  function getScrollHost() {
    return document.getElementById('commentaryScrollArea');
  }

  function getPullSpacer() {
    return document.getElementById('commentaryHeaderPullSpacer');
  }

  function isCommentaryHeaderDragTarget(target) {
    var titleHeader = document.getElementById('popupDragHeader');
    var movable = document.getElementById('commentaryMovableHeader');
    if (!target) return false;
    if (titleHeader && titleHeader.contains(target)) return true;
    if (movable && movable.contains(target)) return true;
    return false;
  }

  function getHeaderPullSpace() {
    var spacer = getPullSpacer();
    var n = 0;
    if (!spacer) return 0;
    n = parseFloat(spacer.style.height);
    if (isNaN(n)) n = 0;
    return n < 0 ? 0 : n;
  }

  function readSafeAreaBottom() {
    var probe = document.createElement('div');
    var h = 0;
    probe.setAttribute('aria-hidden', 'true');
    probe.style.cssText = 'position:fixed;left:0;bottom:0;width:0;height:env(safe-area-inset-bottom,0px);pointer-events:none;visibility:hidden;';
    document.body.appendChild(probe);
    h = probe.offsetHeight || 0;
    document.body.removeChild(probe);
    return h;
  }

  /* Layout reads only here — open / touchstart / resize. Never during touchmove. */
  function refreshPullMetrics() {
    var host = getScrollHost();
    var footer =
      document.getElementById('gomnaCommentaryInlineControls') ||
      document.querySelector('#commentaryPopupBox > .gomna-audio-commentary-controls-footer') ||
      document.querySelector('#commentaryPopupBox > .gomna-commentary-legacy-close-wrap');
    var tip =
      document.getElementById('commentaryMovableHeader') ||
      document.getElementById('popupDragHeader');
    var current;
    var footerTop;
    var tipBottom;
    var gap;
    var room;
    var byHost;
    if (!host || !tip) {
      pullMetrics.maxSpace = 0;
      pullMetrics.ready = false;
      return pullMetrics;
    }
    current = getHeaderPullSpace();
    pullMetrics.safeBottom = readSafeAreaBottom();
    footerTop = footer ? footer.getBoundingClientRect().top : (window.innerHeight - 72);
    tipBottom = tip.getBoundingClientRect().bottom + (host.scrollTop || 0);
    gap = FOOTER_GAP_PX + pullMetrics.safeBottom;
    room = Math.floor(footerTop - gap - tipBottom + current);
    byHost = Math.floor((host.clientHeight || window.innerHeight) * 0.92);
    pullMetrics.maxSpace = Math.max(0, Math.min(room, byHost));
    pullMetrics.ready = true;
    return pullMetrics;
  }

  function formatPullHeight(px) {
    var n = Math.max(0, px || 0);
    /* Keep subpixels; trim float noise without 1px snapping. */
    return Math.round(n * 100) / 100;
  }

  /* Very light resistance only in the last ~20–28px — stay near 1:1, no heavy drag. */
  function softClampPullSpace(raw, maxSpace) {
    var edge;
    var softStart;
    var over;
    var gained;
    var ease;
    if (!isFinite(raw) || raw <= 0) return 0;
    if (!isFinite(maxSpace) || maxSpace <= 0) return 0;
    if (raw >= maxSpace) return maxSpace;
    edge = Math.min(28, Math.max(20, maxSpace * 0.08));
    softStart = maxSpace - edge;
    if (raw <= softStart) return raw;
    over = raw - softStart;
    ease = Math.max(0, 1 - over / edge);
    gained = over * (0.9 + 0.1 * ease);
    return Math.min(maxSpace, softStart + gained);
  }

  function writePullSpacerHeight(px) {
    var spacer = getPullSpacer();
    var next;
    var prev;
    if (!spacer) return 0;
    next = formatPullHeight(px);
    prev = parseFloat(spacer.style.height);
    if (!isNaN(prev) && Math.abs(prev - next) < 0.1) return prev;
    spacer.style.transition = 'none';
    spacer.style.height = next + 'px';
    return next;
  }

  function notifyHeaderPullInteraction(phase) {
    var api = window.GOMNA_COMMENTARY_AUTO_CENTER;
    if (!api) return;
    try {
      if (phase === 'start' && typeof api.onHeaderPullStart === 'function') api.onHeaderPullStart();
      else if (phase === 'end' && typeof api.onHeaderPullEnd === 'function') api.onHeaderPullEnd();
      else if (typeof api.noteUserInteraction === 'function') api.noteUserInteraction('header-pull');
    } catch (ePullNote) { /* ignore */ }
  }

  function cancelPullRaf() {
    if (pullRafId) {
      cancelAnimationFrame(pullRafId);
      pullRafId = 0;
    }
  }

  function schedulePullFrame() {
    var gen;
    if (!headerDrag || !headerDrag.active) return;
    if (pullRafId) return;
    gen = headerDrag.gen;
    pullRafId = requestAnimationFrame(function() {
      var dy;
      var next;
      var maxSpace;
      pullRafId = 0;
      if (!headerDrag || !headerDrag.active || headerDrag.gen !== gen) return;
      dy = headerDrag.lastY - headerDrag.startY;
      maxSpace = headerDrag.maxSpace;
      next = softClampPullSpace(headerDrag.originSpace + dy, maxSpace);
      if (Math.abs(next - headerDrag.appliedSpace) < 0.1) return;
      headerDrag.appliedSpace = next;
      writePullSpacerHeight(next);
    });
  }

  function resetHeaderPullSpace() {
    cancelPullRaf();
    pullDragGen += 1;
    headerDrag = null;
    suppressHeaderClickOnce = false;
    writePullSpacerHeight(0);
  }

  window.__gomnaResetCommentaryHeaderPullSpace = resetHeaderPullSpace;
  window.__gomnaRefreshCommentaryHeaderPullMetrics = refreshPullMetrics;
  /* Back-compat aliases from prior transform experiments */
  window.__gomnaResetCommentaryHeaderTranslateY = resetHeaderPullSpace;
  window.__gomnaResetCommentaryPopupSheetY = resetHeaderPullSpace;

  function startDrag(boxId, clientX, clientY, ev) {
    var box = document.getElementById(boxId);
    if (!box) return;
    var rect = box.getBoundingClientRect();
    dragState = {
      boxId: boxId,
      startX: clientX,
      startY: clientY,
      startLeft: rect.left,
      startTop: rect.top
    };
    box.style.position = 'fixed';
    box.style.margin = '0';
    box.style.left = rect.left + 'px';
    box.style.top = rect.top + 'px';
    box.style.transform = 'none';
    if (ev) ev.preventDefault();
  }

  function moveDrag(clientX, clientY, ev) {
    if (!dragState) return;
    var box = document.getElementById(dragState.boxId);
    if (!box) return;
    var dx = clientX - dragState.startX;
    var dy = clientY - dragState.startY;
    var c = clampBox(box, dragState.startLeft + dx, dragState.startTop + dy);
    box.style.left = c.left + 'px';
    box.style.top = c.top + 'px';
    if (ev) ev.preventDefault();
  }

  function beginHeaderDragCandidate(clientX, clientY) {
    var host = getScrollHost();
    var spacer = getPullSpacer();
    var metrics;
    if (!host || !spacer) return;
    cancelPullRaf();
    metrics = refreshPullMetrics();
    spacer.style.transition = 'none';
    pullDragGen += 1;
    headerDrag = {
      gen: pullDragGen,
      startX: clientX,
      startY: clientY,
      lastY: clientY,
      originSpace: getHeaderPullSpace(),
      appliedSpace: getHeaderPullSpace(),
      maxSpace: metrics.maxSpace || 0,
      startScrollTop: host.scrollTop || 0,
      decided: false,
      active: false
    };
  }

  function moveHeaderDragCandidate(clientX, clientY, ev) {
    var dx;
    var dy;
    if (!headerDrag) return;
    if (!getPullSpacer()) {
      cancelPullRaf();
      headerDrag = null;
      return;
    }
    headerDrag.lastY = clientY;
    dx = clientX - headerDrag.startX;
    dy = clientY - headerDrag.startY;

    if (!headerDrag.decided) {
      if (Math.abs(dx) < HEADER_THRESHOLD_PX && Math.abs(dy) < HEADER_THRESHOLD_PX) return;
      headerDrag.decided = true;
      if (Math.abs(dy) <= Math.abs(dx)) {
        cancelPullRaf();
        headerDrag = null;
        return;
      }
      /* At rest: only pull down when already at top of scroll. */
      if (headerDrag.originSpace <= 0) {
        if ((headerDrag.startScrollTop || 0) > 1 || dy <= 0) {
          cancelPullRaf();
          headerDrag = null;
          return;
        }
      }
      headerDrag.active = true;
      suppressHeaderClickOnce = true;
      notifyHeaderPullInteraction('start');
    }

    if (!headerDrag.active) return;
    if (ev && ev.cancelable) ev.preventDefault();
    schedulePullFrame();
  }

  function endHeaderDragCandidate() {
    var wasActive = !!(headerDrag && headerDrag.active);
    cancelPullRaf();
    if (headerDrag && headerDrag.active) {
      /* Flush final finger position once — no layout remeasure. */
      var dy = headerDrag.lastY - headerDrag.startY;
      var next = softClampPullSpace(headerDrag.originSpace + dy, headerDrag.maxSpace);
      writePullSpacerHeight(next);
    }
    pullDragGen += 1;
    headerDrag = null;
    if (wasActive) notifyHeaderPullInteraction('end');
  }

  function abortHeaderDragForPinch() {
    var wasActive = !!(headerDrag && headerDrag.active);
    cancelPullRaf();
    pullDragGen += 1;
    headerDrag = null;
    if (wasActive) notifyHeaderPullInteraction('end');
    notifyHeaderPullInteraction('pinch');
  }

  document.addEventListener('click', function(e) {
    if (!suppressHeaderClickOnce) return;
    if (!isCommentaryHeaderDragTarget(e.target)) {
      suppressHeaderClickOnce = false;
      return;
    }
    e.preventDefault();
    e.stopPropagation();
    suppressHeaderClickOnce = false;
  }, true);

  document.addEventListener('mousedown', function(e) {
    var hComment = document.getElementById('popupDragHeader');
    var hRange = document.getElementById('verseRangeDragHeader');
    if (hComment && hComment.contains(e.target) && e.target.tagName !== 'BUTTON') {
      if (window.__gomnaCommentaryGestureIsActive && window.__gomnaCommentaryGestureIsActive()) return;
      if (usesMobileCommentaryHeaderDrag()) return;
      startDrag('commentaryPopupBox', e.clientX, e.clientY, e);
    } else if (hRange && hRange.contains(e.target) && e.target.tagName !== 'BUTTON') {
      startDrag('verseRangeModalBox', e.clientX, e.clientY, e);
    }
  });

  document.addEventListener('mousemove', function(e) {
    if (dragState) moveDrag(e.clientX, e.clientY, null);
  });

  document.addEventListener('mouseup', function() {
    dragState = null;
  });

  document.addEventListener('touchstart', function(e) {
    var hRange = document.getElementById('verseRangeDragHeader');
    var t = e.touches[0];
    if (!t) return;

    if (e.touches.length >= 2) {
      abortHeaderDragForPinch();
      dragState = null;
      return;
    }

    if (usesMobileCommentaryHeaderDrag() && isCommentaryHeaderDragTarget(e.target)) {
      if (window.__gomnaCommentaryGestureIsActive && window.__gomnaCommentaryGestureIsActive()) return;
      beginHeaderDragCandidate(t.clientX, t.clientY);
      return;
    }

    if (
      document.getElementById('popupDragHeader') &&
      document.getElementById('popupDragHeader').contains(e.target) &&
      e.target.tagName !== 'BUTTON'
    ) {
      if (window.__gomnaCommentaryGestureIsActive && window.__gomnaCommentaryGestureIsActive()) return;
      startDrag('commentaryPopupBox', t.clientX, t.clientY);
    } else if (hRange && hRange.contains(e.target) && e.target.tagName !== 'BUTTON') {
      startDrag('verseRangeModalBox', t.clientX, t.clientY);
    }
  }, { passive: true });

  document.addEventListener('touchmove', function(e) {
    var t;
    if (e.touches.length >= 2) {
      abortHeaderDragForPinch();
      dragState = null;
      return;
    }
    t = e.touches[0];
    if (!t) return;

    if (headerDrag) {
      moveHeaderDragCandidate(t.clientX, t.clientY, e);
      return;
    }
    if (!dragState) return;
    moveDrag(t.clientX, t.clientY, e);
  }, { passive: false });

  document.addEventListener('touchend', function() {
    dragState = null;
    endHeaderDragCandidate();
  });
  document.addEventListener('touchcancel', function() {
    dragState = null;
    endHeaderDragCandidate();
  });

  window.addEventListener('resize', function() {
    if (!document.getElementById('commentaryScrollArea')) return;
    refreshPullMetrics();
  }, { passive: true });
  window.addEventListener('orientationchange', function() {
    if (!document.getElementById('commentaryScrollArea')) return;
    refreshPullMetrics();
  }, { passive: true });
})();

function stripUnifiedSectionEmoji(title) {
  return String(title || '').replace(/^[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\uFE0F\u200D]+\s*/u, '').trim();
}

function findUnifiedBookSection(bookName, testament) {
  var sections = testament === 'old' ? getUnifiedOldSections() : getUnifiedNewSections();
  for (var s = 0; s < sections.length; s++) {
    if (sections[s].books.indexOf(bookName) !== -1) return sections[s];
  }
  return null;
}

function getUnifiedBookCategoryLabel(bookName, testament) {
  var sec = findUnifiedBookSection(bookName, testament);
  if (!sec) return null;
  return (testament === 'old' ? '구약' : '신약') + ' · ' + stripUnifiedSectionEmoji(sec.title);
}

function buildUnifiedBooksHtml(testament) {
  var sections = testament === 'old' ? getUnifiedOldSections() : getUnifiedNewSections();
  var data = testament === 'old' ? oldTestamentData : newTestamentData;
  var html = '';
  for (var s = 0; s < sections.length; s++) {
    var sec = sections[s];
    var secTitle = stripUnifiedSectionEmoji(sec.title);
    html += '<div class="unified-bc-sec">' + secTitle + '</div><div class="unified-bc-book-grid">';
    for (var b = 0; b < sec.books.length; b++) {
      var bookName = sec.books[b];
      var bd = findBook(data, bookName);
      if (!bd) continue;
      var chc = getDisplayedChapterCount(bd);
      var sel = (currentBook && currentBook.name === bookName && currentBook.testament === testament) ? ' unified-bc-book--sel' : '';
      html += '<button type="button" class="unified-bc-book' + sel + '" onclick="unifiedBcPickBook(\'' + bookName + '\',' + chc + ',\'' + testament + '\')">' + bookName + '</button>';
    }
    html += '</div>';
  }
  return html;
}

function buildUnifiedCategoryBooksHtml(testament, categoryLabel) {
  var sections = testament === 'old' ? getUnifiedOldSections() : getUnifiedNewSections();
  var data = testament === 'old' ? oldTestamentData : newTestamentData;
  var sec = null;
  for (var s = 0; s < sections.length; s++) {
    if (stripUnifiedSectionEmoji(sections[s].title) === categoryLabel) { sec = sections[s]; break; }

}

function buildUnifiedAllBooksSectionsHtml(sections, data, testament) {
  var html = '';

function renderUnifiedModalBody() {

  var html = '';

    html += buildUnifiedAllBooksHtml();

    if (curCatLabel) html += '<div class="unified-bc-cur-cat">' + curCatLabel + '</div>';
    html += '<div class="unified-bc-chapter-grid">';
    for (var i = 1; i <= unifiedBcState.displayChapters; i++) {
      var isCur = currentBook && currentBook.name === unifiedBcState.selectedBook && currentChapter === i;
      html += buildReaderChapterButtonHtml(i, {
        className: 'unified-bc-ch-btn',
        currentClass: 'unified-bc-ch--cur',
        current: isCur,
        bookName: unifiedBcState.selectedBook,
        onclick: 'unifiedBcApplyChapter(' + i + ')'
      });
    }
    html += '</div>';

  body.style.visibility = 'hidden';
  body.innerHTML = html;
  body.scrollTop = 0;
  renderUnifiedModalHead();
  renderUnifiedModalFooter();
  if (unifiedBcState.step === 'chapters') {
    applyReaderChapterLabels(body);
    connectReaderChapterLabelObserver(body);
    var curBtn = body.querySelector('.unified-bc-ch--cur');

      curBtn.scrollIntoView({ block: 'center' });

    disconnectReaderChapterLabelObserver();

function unifiedBcApplyChapter(ch) {
  if (!unifiedBcState.selectedBook) return;
  var name = unifiedBcState.selectedBook;
  var testament = unifiedBcState.testament;
  var displayChapters = unifiedBcState.displayChapters;
  currentBook = { name: name, chapters: displayChapters, testament: testament };
  currentChapter = ch;
  currentTab = testament;
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
  var activeTab = document.querySelector('.tab[data-tab="' + testament + '"]');
  if (activeTab) activeTab.classList.add('active');
  document.querySelectorAll('.view').forEach(function(v) { v.classList.remove('active'); });
  document.getElementById('verseView').classList.add('active');
  updateHeaderBtns(testament);
  syncReaderNavActive();
  closeUnifiedBookChapterModal();
  if (window.GomnaAnalytics && currentBook) {
    GomnaAnalytics.trackNavigateChapter(name, ch, 'select', testament);
  }
  renderVerses(1);
  if (typeof window.exitScriptureEntryView === 'function') {
    window.exitScriptureEntryView();
  } else if (typeof window.exitDailyWordView === 'function') {
    window.exitDailyWordView();
  }
  if (window.__verseToolbarChapterNavFromMenu) {
    window.__verseToolbarChapterNavFromMenu = false;
    closeVerseToolbarTargetMenu();
    requestAnimationFrame(function() {
      var verseList = document.getElementById('verseList');
      if (verseList) {
        try { verseList.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) { verseList.scrollIntoView({ block: 'start' }); }
      }
      try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch (e2) { window.scrollTo(0, 0); }
    });
  }
  loadCommentaryData();
  var commentaryPopupEl = document.getElementById('commentaryPopup');
  if (commentaryPopupEl && commentaryPopupEl.classList.contains('show')) {
    showCommentary(1);
  }
}

  unifiedBcState.selectedBook = currentBook.name;
  unifiedBcState.displayChapters = bd ? getDisplayedChapterCount(bd) : (currentBook.chapters || 0);

        txt.textContent = bookLabel + ' ' + currentChapter;
      } else if (titleLang === 'ja') {
        txt.textContent = bookLabel + currentChapter + '章';
      } else {
        txt.textContent = currentBook.name + ' ' + currentChapter + u;
      }
      var titleBtn = document.getElementById('verseReadTitleBtn');
      if (titleBtn && (titleLang === 'en' || titleLang === 'ja')) {
        titleBtn.classList.add('notranslate');
        titleBtn.setAttribute('translate', 'no');
        titleBtn.setAttribute('lang', titleLang);
        txt.classList.add('notranslate');
        txt.setAttribute('translate', 'no');
        txt.setAttribute('lang', titleLang);
      } else if (titleBtn) {
        titleBtn.classList.remove('notranslate');
        titleBtn.removeAttribute('translate');
        titleBtn.removeAttribute('lang');
        txt.classList.remove('notranslate');
        txt.removeAttribute('translate');
        txt.removeAttribute('lang');
      }
    }
  }
  var prev = document.getElementById('opt4BottomPrev');
  var next = document.getElementById('opt4BottomNext');
  var headerPrev = document.getElementById('verseReadPrevBtn');
  var headerNext = document.getElementById('verseReadNextBtn');
  var data = currentBook.testament === 'old' ? oldTestamentData : newTestamentData;
  var bookData = findBook(data, currentBook.name);
  var chCount = bookData ? getDisplayedChapterCount(bookData) : (currentBook.chapters || 999);
  if (prev) prev.disabled = currentChapter <= 1;
  if (next) next.disabled = currentChapter >= chCount;
  if (headerPrev) headerPrev.disabled = currentChapter <= 1;
  if (headerNext) headerNext.disabled = currentChapter >= chCount;
  updateVerseToolbar();
  syncScriptureDockActive();
  if (typeof window.syncPlainVerseGestureMode === 'function') window.syncPlainVerseGestureMode();
}

function getVerseRefLabel(verseNum) {
  if (!currentBook || !verseNum) return '';
  return currentBook.name + ' ' + currentChapter + ':' + verseNum;
}

function getVersePlainText(verseNum) {

}

function getVerseAudioId(verseNum) {
  if (!window.GOMNA_AUDIO_BOOK || !window.GOMNA_AUDIO_BOOK.getBookAudioId || !currentBook || !verseNum) return null;
  var bookId = GOMNA_AUDIO_BOOK.getBookAudioId(currentBook.name);
  if (!bookId) return null;
  return bookId + '.' + String(currentChapter).padStart(3, '0') + '.' + String(verseNum).padStart(3, '0') + '.bible';
}

function isVerseAudioAvailable(verseNum) {
  var audioId = getVerseAudioId(verseNum);
  if (!audioId) return false;
  var audios = window.GOMNA_AUDIO_CONFIG && window.GOMNA_AUDIO_CONFIG.manifestData && window.GOMNA_AUDIO_CONFIG.manifestData.audios;
  var entry = audios && audios[audioId];
  if (!entry || !entry.filePath || entry.type !== 'bible') return false;
  if (entry.status === 'published') return true;
  return audioId === 'genesis.001.001.bible';
}

function isVerseFavorited(verseNum) {
  if (!currentBook || !verseNum) return false;

}

function applyVerseSelectionHighlight() {

  });
}

function syncChapterSelectionHighlight() {
  var items = document.querySelectorAll('#verseList .verse-item');
  items.forEach(function(item) {
    item.classList.remove('verse-item--chapter-selected');
  });
  // 기능 기본값 chapter가 아니라, 사용자가 '장 전체 선택'을 직접 골랐을 때만 행 강조

function selectVerse(verseNum, itemEl) {
  if (!verseNum || !document.getElementById('verseList')) return;
  var idx = selectedVerseNums.indexOf(verseNum);
  var nowSelected;
  if (idx === -1) {
    selectedVerseNums.push(verseNum);
    nowSelected = true;
  } else {
    selectedVerseNums.splice(idx, 1);
    nowSelected = false;
  }
  var isEmpty = selectedVerseNums.length === 0;
  verseListenMode = isEmpty ? 'chapter' : 'selected';
  // 본문 탭 선택은 메뉴 체크와 무관. 장 전체 선택 UI 강조도 해제
  userVerseTargetChoice = null;
  selectedVerseNum = isEmpty ? null : selectedVerseNums[selectedVerseNums.length - 1];
  var item = itemEl || document.querySelector('#verseList .verse-item[data-verse="' + verseNum + '"]');
  if (item) {
    item.classList.toggle('verse-item--selected', nowSelected);
    item.setAttribute('aria-selected', nowSelected ? 'true' : 'false');
    item.classList.remove('verse-item--chapter-selected');
  }
  // 장 전체 행 강조가 남아 있으면 제거 (기능 chapter 전환으로 다시 붙이지 않음)
  document.querySelectorAll('#verseList .verse-item--chapter-selected').forEach(function(el) {
    el.classList.remove('verse-item--chapter-selected');
  });
  updateOpt4BottomBar();
}

function restoreVerseSelection(verseNums) {

function getChapterAudioIds() {
  if (!currentBook || !currentChapter || !currentVerseCount) return [];
  var bookAudioId = window.GOMNA_AUDIO_BOOK && window.GOMNA_AUDIO_BOOK.getBookAudioId ? window.GOMNA_AUDIO_BOOK.getBookAudioId(currentBook.name) : null;

function getRangeAudioIds() {

  var bookAudioId = window.GOMNA_AUDIO_BOOK && window.GOMNA_AUDIO_BOOK.getBookAudioId ? window.GOMNA_AUDIO_BOOK.getBookAudioId(currentBook.name) : null;

function isSameAudioIdArray(a, b) {
  if (!a || !b || a.length !== b.length) return false;
  for (var i = 0; i < a.length; i++) {
    if (a[i] !== b[i]) return false;
  }
  return true;
}

function syncVerseToolbarListenButton() {
  var btn = document.getElementById('opt4VerseListen');
  if (!btn) return;
  var engine = window.GOMNA_AUDIO_ENGINE;
  var state = engine && engine.getState ? engine.getState() : null;
  btn.hidden = false;
  btn.disabled = false;
  btn.removeAttribute('aria-disabled');
  var uiLang = getReaderUiLangCode();
  var nativeUi = isReaderNativeUiLang(uiLang);
  var tLabels = getReaderToolbarLabels(uiLang || 'ko');

  if (verseListenMode === 'chapter' || (!selectedVerseNums.length && verseListenMode === 'selected')) {
    btn.removeAttribute('data-audio-id');
    var chapterLabel = nativeUi ? tLabels.listen : '전체 듣기';
    if (state && state.queueActive && isSameAudioIdArray(state.queueAudioIds, getChapterAudioIds())) {
      if (state.isPlaying) chapterLabel = nativeUi ? tLabels.listenPause : '전체 일시정지';
      else if (state.isPaused) chapterLabel = nativeUi ? tLabels.listenResume : '전체 이어듣기';
    }
    btn.textContent = chapterLabel;
    markReaderOwnedTranslate(btn, nativeUi);
    return;
  }

  if (verseListenMode === 'range') {
    btn.removeAttribute('data-audio-id');
    var rangeCount = Math.max(0, opt4RangeEnd - opt4RangeStart + 1);
    var rangeLabel = rangeCount === 1 ? '1절 듣기' : rangeCount + '개 절 듣기';
    if (state && state.queueActive && isSameAudioIdArray(state.queueAudioIds, getRangeAudioIds())) {
      if (state.isPlaying) rangeLabel = '일시정지';
      else if (state.isPaused) rangeLabel = '이어듣기';
    }
    btn.textContent = rangeLabel;
    return;
  }

  if (selectedVerseNums.length > 1) {
    btn.removeAttribute('data-audio-id');
    var multiLabel = selectedVerseNums.length + '개 절 듣기';
    if (state && state.queueActive && state.queueSource === getSelectedVersesAudioQueueSource()) {
      if (state.isPlaying) multiLabel = '일시정지';
      else if (state.isPaused) multiLabel = '이어듣기';
    }
    btn.textContent = multiLabel;
    return;
  }

  var actionVerse = getToolbarActionVerse();
  var audioId = getVerseAudioId(actionVerse);
  if (audioId && isVerseAudioAvailable(actionVerse)) {
    btn.setAttribute('data-audio-id', audioId);
  } else {
    btn.removeAttribute('data-audio-id');
  }
  var label = '1절 듣기';
  if (selectedVerseNums.length === 1) label = '1절 듣기';
  if (state && audioId && state.currentAudioId === audioId) {
    if (state.isPlaying) label = '일시정지';
    else if (state.isPaused) label = '이어듣기';
  } else if (audioId && window.GOMNA_AUDIO_BIBLE_RESUME && GOMNA_AUDIO_BIBLE_RESUME.getSessionForAudioId && GOMNA_AUDIO_BIBLE_RESUME.getSessionForAudioId(audioId)) {
    label = '이어듣기';
  }
  btn.textContent = label;
}

function chooseVerseListenTargetMode(mode) {
  closeVerseToolbarTargetMenu();
  if (mode === 'clear') {
    cancelVerseToolbarSelection();
    return;
  }
  if (mode === 'selected') {
    if (!selectedVerseNums.length) {
      if (window.GOMNA_AUDIO_TOAST) GOMNA_AUDIO_TOAST('본문에서 절을 선택해 주세요');
      return;
    }
    verseListenMode = 'selected';
    userVerseTargetChoice = null;
    syncChapterSelectionHighlight();
    updateOpt4BottomBar();
    return;
  }
  if (mode === 'range') {
    userVerseTargetChoice = 'range';
    syncChapterSelectionHighlight();
    openVerseRangeModal();
    return;
  }
  if (mode === 'chapter') {
    clearVerseSelection();
    multiCommentaryList = null;
    multiCommentaryIndex = -1;
    opt4RangeStart = 1;
    opt4RangeEnd = currentVerseCount;
    applyRange(opt4RangeStart, opt4RangeEnd);
    verseListenMode = 'chapter';
    userVerseTargetChoice = 'chapter';
    syncChapterSelectionHighlight();
    updateOpt4BottomBar();
    return;
  }
}

function shareVerses(verseNums) {
  var data = currentBook.testament === 'old' ? oldTestamentData : newTestamentData;
  var bookData = findBook(data, currentBook.name);
  var chapterData = bookData.chapters.find(function(c) { return c.chapter === currentChapter; });
  var lines = verseNums.map(function(vn) {
    var verseData = chapterData.verses.find(function(v) { return v.verse === vn; });
    return currentBook.name + ' ' + currentChapter + ':' + vn + ' ' + (verseData ? verseData.text : '');
  });
  var text = '📖 ' + lines.join('\n') + '\n\n- 은혜의말씀 앱';
  var itemId = (window.GomnaAnalytics ? GomnaAnalytics.bookSlug(currentBook.name) : currentBook.name) + '_' + currentChapter + '_' + verseNums.join('-');
  if(navigator.share) {
    navigator.share({ title: '은혜의말씀', text: text, url: 'https://gomnastudio.com/' }).then(function() {
      if (window.GomnaAnalytics) GomnaAnalytics.trackShare('native', itemId);
    }).catch(function() {});
  } else if(navigator.clipboard) {
    navigator.clipboard.writeText(text).then(function() {
      if (window.GomnaAnalytics) GomnaAnalytics.trackShare('clipboard', itemId);
      alert('클립보드에 복사되었습니다!');
    });
  } else {
    alert(text);
    if (window.GomnaAnalytics) GomnaAnalytics.trackShare('dialog', itemId);
  }
}

function opt4ToolbarShare() {
  var verses = getToolbarActionVerses();

/* 터치 제스처 엔진 공통 기기 판별 — UA·화면 너비 미사용.
   맥북/데스크톱(마우스·트랙패드)은 false → 브라우저 세로 스크롤 유지. */
function gomnaShouldUseTouchGestureEngine() {
  var touchPoints = Number(navigator.maxTouchPoints || 0);
  var coarse = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
  var noHover = !!(window.matchMedia && window.matchMedia('(hover: none)').matches);
  return touchPoints > 0 && (coarse || noHover);
