*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;color:#000}
body{background:linear-gradient(170deg,#e2c99f 0%,#d1b995 60%,#c1ac8e 100%);min-height:100vh;overflow-x:hidden;position:relative}
.particles{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.particle{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,235,180,.7) 0%,rgba(255,200,120,.2) 60%,transparent 100%);filter:blur(1.5px);opacity:0;animation:floatUp 12s linear infinite}
.particle:nth-child(1){left:10%;width:8px;height:8px;animation-delay:0s;animation-duration:13s}
.particle:nth-child(2){left:30%;width:5px;height:5px;animation-delay:2s;animation-duration:15s}
.particle:nth-child(3){left:55%;width:10px;height:10px;animation-delay:4s;animation-duration:11s}
.particle:nth-child(4){left:75%;width:6px;height:6px;animation-delay:1s;animation-duration:14s}
.particle:nth-child(5){left:88%;width:7px;height:7px;animation-delay:6s;animation-duration:12s}

.container{max-width:520px;margin:0 auto;padding:18px 16px 24px;position:relative;z-index:1;min-height:100vh}

.title-block{flex:1}
.title{font-size:calc(var(--font-size,17px) * 20 / 17);font-weight:500;line-height:1.15;letter-spacing:-0.3px}
.sub{font-family:Georgia,serif;font-size:calc(var(--font-size,17px) * 12 / 17);font-style:italic;letter-spacing:0.5px;opacity:.88;margin-top:3px}
.settings-btn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;background:transparent;border:none;padding:0}

@keyframes gearRotate{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes gearGlow{0%,100%{filter:drop-shadow(0 0 5px rgba(255,235,180,0.6))}50%{filter:drop-shadow(0 0 14px rgba(255,235,180,1)) drop-shadow(0 0 22px rgba(255,215,100,0.7))}}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.card{aspect-ratio:.58/1;border-radius:20px;padding:10px 7px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:space-between;transition:transform .25s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden}

.card.old{background:#f3eadb;color:#000}
.card.new{background:#f3eadb;color:#000}
.card.easy{background:#f3eadb;color:#000}
button.card{border:0;margin:0;font-family:inherit;font-size:inherit;color:inherit;text-align:inherit;line-height:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation;width:100%;-webkit-appearance:none;appearance:none}
.stage{flex:1;width:100%;display:flex;align-items:center;justify-content:center;perspective:900px;position:relative}
.book{width:78%;height:80%;position:relative;transform-style:preserve-3d}
.b-closed{position:absolute;inset:0;border-radius:2px 6px 6px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .35s ease,transform .5s cubic-bezier(.4,0,.2,1);overflow:hidden;padding:0 6px}
.b-closed.faded{background:linear-gradient(135deg,#b5965f 0%,#9a7a48 50%,#6e5028 100%);color:#3d2810;border:.5px solid rgba(80,55,20,.5);box-shadow:inset 0 0 10px rgba(60,40,15,.55),inset -3px 0 6px rgba(45,28,10,.45),inset 3px 0 5px rgba(200,170,120,.2),2px 2px 8px rgba(0,0,0,.2)}
.b-closed.faded::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 75% 22%,rgba(70,48,20,.4) 0%,transparent 28%),radial-gradient(circle at 22% 78%,rgba(50,35,12,.35) 0%,transparent 25%);pointer-events:none}
.b-closed.rose{background:linear-gradient(135deg,#e8c5b0 0%,#d4a594 50%,#a8745f 100%);color:#5a2818;border:.5px solid rgba(120,55,30,.45);box-shadow:inset 0 0 8px rgba(120,55,30,.3),inset -3px 0 5px rgba(100,45,25,.3),2px 2px 8px rgba(0,0,0,.2)}
.b-closed.rose::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 70% 28%,rgba(150,80,55,.18) 0%,transparent 32%);pointer-events:none}
.b-closed::before{content:"";position:absolute;inset:3px;border:.5px solid currentColor;opacity:.35;border-radius:1px 4px 4px 1px;pointer-events:none}
.b-closed > *{position:relative;z-index:2}
.b-title-en{font-family:Georgia,serif;font-size:11px;font-weight:500;letter-spacing:2px;line-height:1.25;text-align:center}
.b-line-en{width:62%;height:.5px;background:currentColor;opacity:.55;margin:5px 0}
.b-sub-en{font-family:Georgia,serif;font-size:6.5px;font-style:italic;letter-spacing:1.2px;opacity:.85;text-align:center}
.b-open{position:absolute;inset:0;display:flex;opacity:0;transition:opacity .4s ease;z-index:1}
.b-page{flex:1;background:linear-gradient(180deg,#fdfaf0 0%,#f0e6cc 100%);position:relative;overflow:hidden;box-shadow:inset 0 0 6px rgba(160,120,70,.25)}
.b-page.left{border-radius:2px 0 0 2px;border-right:.5px solid rgba(120,80,40,.4);transform-origin:right center}
.b-page.right{border-radius:0 2px 2px 0;border-left:.5px solid rgba(120,80,40,.4);transform-origin:left center}
.b-page::before{content:"";position:absolute;inset:5px;background:repeating-linear-gradient(0deg,transparent 0,transparent 3px,rgba(110,75,35,.18) 3px,rgba(110,75,35,.18) 4px)}
.book.opening .b-closed{opacity:0;transform:scale(.92) rotateY(-8deg)}
.book.opening .b-open{opacity:1;transition-delay:.2s}
.book.opening .b-page.left{animation:turnL .9s .25s cubic-bezier(.34,1.05,.64,1) backwards}
.book.opening .b-page.right{animation:turnR .9s .25s cubic-bezier(.34,1.05,.64,1) backwards}
@keyframes turnL{from{transform:rotateY(75deg)}to{transform:rotateY(0)}}
@keyframes turnR{from{transform:rotateY(-75deg)}to{transform:rotateY(0)}}
.lamp-wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.lamp{width:90%;height:90%;display:flex;align-items:center;justify-content:center}
.lamp svg{width:100%;height:100%;overflow:visible}
.lamp-glow{opacity:0;transform-origin:78% 38%;transition:opacity 1s ease}
.lamp.lit .lamp-glow{opacity:1;animation:glowB 2.8s ease-in-out infinite .6s}
.lamp-flame-grp{opacity:0;transform-origin:78% 92%;transform:scale(0,0);transition:opacity .35s ease,transform .55s cubic-bezier(.34,1.4,.64,1)}
.lamp.lit .lamp-flame-grp{opacity:1;transform:scale(1,1)}
.lamp.lit .lamp-flame-outer{animation:flameD 1.6s ease-in-out infinite .6s;transform-origin:50% 100%}
.lamp.lit .lamp-flame-inner{animation:flameD 1.2s ease-in-out infinite .8s;transform-origin:50% 100%}
@keyframes flameD{0%,100%{transform:scale(1,1) skewX(0deg)}25%{transform:scale(.92,1.06) skewX(-2deg)}50%{transform:scale(1.06,.96) skewX(1.5deg)}75%{transform:scale(.96,1.03) skewX(-1deg)}}
@keyframes glowB{0%,100%{opacity:.85;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
@keyframes fadeInStaggerEasy{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.easy-keypad{margin:0 auto;display:grid;align-content:center;box-sizing:border-box;max-width:100%}
.easy-keypad.ko-keypad{width:100%;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.easy-keypad.cat-keypad{width:100%;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));grid-auto-flow:column;gap:3px;align-content:stretch}
.easy-keypad.auto-keypad{width:100%;grid-template-columns:repeat(auto-fill,minmax(28px,1fr));gap:6px;justify-content:center}
.easy-key{border:1px solid rgba(180,140,90,.28);cursor:pointer;display:flex;flex-wrap:wrap;align-items:center;align-content:center;justify-content:center;font-family:inherit;font-size:clamp(9px,3.2vw,15px);font-weight:500;color:#1f1408;background:#fff;border-radius:4px;aspect-ratio:1;padding:2px 4px;line-height:1.1;text-align:center;overflow-wrap:anywhere;word-break:break-word;hyphens:auto;-webkit-hyphens:auto;opacity:0;animation:fadeInStaggerEasy .5s ease forwards;transition:transform .2s ease;-webkit-tap-highlight-color:transparent;min-width:0;overflow-x:hidden}
.easy-key.cat-key{aspect-ratio:auto;padding:1px 4px;flex-direction:column-reverse;flex-wrap:nowrap;gap:0;min-height:0;justify-content:center;align-items:center;overflow:visible}
.easy-key.cat-key .cat-label{font-size:clamp(9px,2.3vw,12px);font-weight:600;line-height:1.2;color:#3d2818;text-align:center;word-break:keep-all;white-space:nowrap;overflow:visible;max-width:100%;padding:0;letter-spacing:-0.2px}
.easy-key.cat-key .cat-count{display:block;font-size:clamp(5.5px,1.2vw,7.5px);font-weight:500;line-height:1.1;color:#a87a35;text-align:center;letter-spacing:-0.2px;white-space:nowrap;overflow:visible;max-width:100%;margin-top:0}
.easy-key.cat-key .cat-foreign-line{display:none}
body[data-i18n-mode="foreign"] .easy-key.cat-key .cat-label{font-size:clamp(9px,2.2vw,11.5px);font-weight:600;color:#3d2818;white-space:normal;text-overflow:clip;overflow:visible;line-height:1.1;word-break:normal;overflow-wrap:normal;-webkit-hyphens:none;hyphens:none}
/* Match the keypad's TOP and BOTTOM exactly to the .book covers in the
   neighbouring cards. .book uses height:80% inside .stage with the
   parent's align-items:center vertically centring it. The .stage uses
   flex:1 in its parent .card, so we must give .stage min-height:0 to
   prevent it from being pushed taller by the keypad's content (default
   flex min-height:auto would let stage grow). With this, both .book
   and .cat-keypad resolve their height:80% against the SAME .stage
   height, giving pixel-perfect alignment across all 3 cards. */
.card.easy .stage{min-height:0;overflow:hidden}
.card.easy .easy-keypad.cat-keypad{flex:none;width:100%;height:80%;min-height:0;grid-template-rows:repeat(5,minmax(0,1fr));align-content:stretch;gap:3px}
.card.easy .easy-keypad.cat-keypad > .easy-key.cat-key{min-height:0;height:100%}
.easy-key:hover{transform:scale(1.1)}
.easy-key-all{font-size:11px;font-weight:500;color:#4a3818;background:rgba(255,255,255,.4)}

@keyframes verseGlow{0%,100%{opacity:.4}50%{opacity:.8}}

.sheet-close{margin-left:auto;flex-shrink:0;background:rgba(0,0,0,.07);border:none;width:30px;height:30px;border-radius:50%;cursor:pointer;color:#3d2818;font-size:14px;line-height:1;padding:0;align-self:center;margin-bottom:6px}
.sheet-body{padding:16px 18px 28px;overflow-y:auto;flex:1}
.cat{margin-bottom:16px}
.cat-title{font-size:12px;font-weight:500;color:#a87a35;margin-bottom:8px;letter-spacing:-0.2px}
.book-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.book-item{background:#fff;border-radius:10px;padding:11px 4px;text-align:center;font-size:11.5px;font-weight:500;border:.5px solid rgba(180,140,90,.25);cursor:pointer;line-height:1.2;transition:all .15s;font-family:inherit;color:inherit}
.book-item:hover{background:#fff5e0;border-color:#c89849}
.book-item small{display:block;font-size:9.5px;font-weight:400;color:#a87a35;margin-top:3px}
.cons-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-bottom:16px}
.cons-grid.cat-cons-grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:auto auto repeat(5,minmax(0,1fr));grid-auto-flow:column;gap:6px}
.cons-grid.cat-cons-grid .cat-all-btn{grid-column:1 / -1;grid-row:1;text-align:center;justify-content:center}
.cons-grid.cat-cons-grid .cat-col-header{grid-row:2;text-align:center;font-size:12px;font-weight:700;color:#8a6332;padding:4px 0 2px;letter-spacing:.3px;border-bottom:1px solid rgba(184,134,11,.18);user-select:none;cursor:default}
.cons-grid.cat-cons-grid .cat-col-header.cat-col-ot{grid-column:1;grid-row:2}
.cons-grid.cat-cons-grid .cat-col-header.cat-col-nt{grid-column:2;grid-row:2}
.cons{background:#fff;border:.5px solid rgba(180,140,90,.25);border-radius:14px;padding:11px 0;text-align:center;font-size:14px;font-weight:600;color:#5a3818;cursor:pointer;transition:all .15s;font-family:inherit}
.cons.cat-cons{padding:10px 6px;font-size:12.5px;font-weight:500;line-height:1.25;text-align:center;justify-content:center;word-break:keep-all}
.cons:hover{background:#fff5e0}
.cons.active{background:#c89849;color:#fff;border-color:#a87a35}
.cons-label{font-size:12px;color:#a87a35;margin-bottom:10px;font-weight:500}
.bookmark-empty{text-align:center;padding:50px 20px;color:#8b6234;font-size:13px;line-height:1.7}
.bookmark-empty .icon{font-size:42px;opacity:.4;margin-bottom:12px}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(20,12,4,.92);color:#fff5e0;padding:12px 22px;border-radius:20px;font-size:13px;font-weight:500;z-index:200;display:none;box-shadow:0 4px 20px rgba(0,0,0,.3);max-width:90%;text-align:center}
.toast.show{display:block;animation:toastIn .3s ease}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-40%)}to{opacity:1;transform:translate(-50%,-50%)}}
.popup-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:300;justify-content:center;align-items:center}
.popup-overlay.show{display:flex}
.popup-box{background:#fff;border-radius:20px;padding:28px 24px;width:90%;max-width:420px;max-height:90vh;overflow-y:auto;text-align:center;color:#4A2511}
.popup-title{font-size:18px;font-weight:700;margin-bottom:16px;color:#4A2511}
.font-control{display:flex;justify-content:center;align-items:center;gap:24px;margin-bottom:28px}
.font-btn{width:48px;height:48px;border-radius:50%;border:2px solid #4A2511;background:#fff;color:#4A2511;font-size:22px;font-weight:700;cursor:pointer}
.font-size-display{font-size:20px;font-weight:700;min-width:60px;color:#4A2511}
.popup-close{width:100%;padding:14px;background:#B8751F;color:#fff;border:none;border-radius:25px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit}

function getVerseForDate(d){return DAILY_VERSES[((d.getDate()-1)%30+30)%30];}

function _setVerseDOM(d){
  const v=getVerseForDate(d);
  const today=new Date();
  const isToday=_isSameDate(d,today);
  const lang=window.__gomnaLastLang||'ko';
  const tag=document.getElementById('verse-tag');
  if(tag){
    // Tag is locale-formatted manually (custom translation + Intl date),
    // so we keep translate="no" to prevent Google from double-translating.
    const tagText=(typeof window.GomnaTranslateVerseTag==='function')
      ? window.GomnaTranslateVerseTag(d,isToday,lang)
      : (isToday?'오늘의 말씀':((d.getMonth()+1)+'월 '+d.getDate()+'일의 말씀'));
    tag.textContent=tagText;
    tag.setAttribute('translate','no');
  }
  const txt=document.getElementById('verse-text');
  if(txt){
    // Verse body — let Google Translate widget handle this so foreign-
    // language users see it in their language. Strip any previous
    // translate="no" we may have set in older versions.
    txt.textContent='"'+v.t+'"';
    txt.removeAttribute('translate');
  }
  const ref=document.getElementById('verse-ref');
  if(ref){
    // Reference — translate the Korean book name via our 66-book table so
    // "마태복음 11:28" becomes "Matthew 11:28" / "Mateo 11:28" /
    // "馬太福音 11:28" exactly. We manage this ourselves so we keep
    // translate="no" to keep Google out of it.
    const refLocalized=(typeof window.GomnaTranslateBookRef==='function')
      ? window.GomnaTranslateBookRef(v.r,lang)
      : v.r;
    ref.textContent='— '+refLocalized;
    ref.setAttribute('translate','no');
  }
  const todayBtn=document.getElementById('verseTodayBtn');
  if(todayBtn)todayBtn.style.display=isToday?'none':'inline-block';
  _selectedDate=new Date(d.getFullYear(),d.getMonth(),d.getDate());
}

function renderCalendar(year,month){
  const grid=document.getElementById('calGrid');
  const title=document.getElementById('calTitle');
  if(!grid||!title)return;
  title.textContent=year+'년 '+_MONTHS[month];
  const startWd=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const today=new Date();
  let html='';
  for(let i=0;i<startWd;i++)html+='<button type="button" class="cal-cell empty" tabindex="-1" aria-hidden="true"></button>';
  for(let d=1;d<=daysInMonth;d++){
    const wd=new Date(year,month,d).getDay();
    const cls=['cal-cell'];
    if(wd===0)cls.push('sun');else if(wd===6)cls.push('sat');
    if(today.getFullYear()===year&&today.getMonth()===month&&today.getDate()===d)cls.push('today');
    if(_selectedDate.getFullYear()===year&&_selectedDate.getMonth()===month&&_selectedDate.getDate()===d)cls.push('selected');
    html+='<button type="button" class="'+cls.join(' ')+'" data-d="'+d+'" aria-label="'+(month+1)+'월 '+d+'일">'+d+'</button>';
  }
  grid.innerHTML=html;
  grid.querySelectorAll('.cal-cell:not(.empty)').forEach(function(c){
    c.addEventListener('click',function(){
      const d=parseInt(c.getAttribute('data-d'),10);
      applyVerseForDate(new Date(_calendarMonth.getFullYear(),_calendarMonth.getMonth(),d));
      closeVerseDatePicker();
    });
  });
}

    }else{filtered=allBooks;}
    const allLabel=(window.GomnaBibleCategories.getLabel&&{en:'All Books',es:'Todos los libros',pt:'Todos os livros','zh-CN':'全部','zh':'全部','zh-TW':'全部',fr:'Tous',de:'Alle',ja:'すべて',vi:'Tất cả',hi:'सभी पुस्तकें',id:'Semua Kitab',tl:'Lahat ng Aklat',sw:'Vitabu vyote',af:'Alle boeke'}[lang])||'전체 성경';
    const otHdrMap={ko:'구약',en:'Old Testament',es:'Antiguo Testamento',pt:'Antigo Testamento','zh-CN':'旧约','zh':'旧约','zh-TW':'舊約',fr:'Ancien Testament',de:'Altes Testament',ja:'旧約',vi:'Cựu Ước',hi:'पुराना नियम',id:'Perjanjian Lama',tl:'Lumang Tipan',sw:'Agano la Kale',af:'Ou Testament'};
    const ntHdrMap={ko:'신약',en:'New Testament',es:'Nuevo Testamento',pt:'Novo Testamento','zh-CN':'新约','zh':'新约','zh-TW':'新約',fr:'Nouveau Testament',de:'Neues Testament',ja:'新約',vi:'Tân Ước',hi:'नया नियम',id:'Perjanjian Baru',tl:'Bagong Tipan',sw:'Agano Jipya',af:'Nuwe Testament'};
    const otHdrText=otHdrMap[lang]||otHdrMap['ko'];
    const ntHdrText=ntHdrMap[lang]||ntHdrMap['ko'];
    const allBtn='<button class="cons cat-all-btn'+(!currentCategory?' active':'')+'" onclick="setCategory(null)" translate="no">'+(!currentCategory?'★ ':'')+allLabel+'</button>';
    const otHdr='<div class="cat-col-header cat-col-ot" data-i18n-testament="ot" translate="no">'+escapeHtml(otHdrText)+'</div>';
    const ntHdr='<div class="cat-col-header cat-col-nt" data-i18n-testament="nt" translate="no">'+escapeHtml(ntHdrText)+'</div>';
    const catBtns=cats.map(function(c){
      const key=c[0];
      const label=window.GomnaBibleCategories.getShort(key,lang);
      const active=(currentCategory===key)?' active':'';
      return '<button class="cons cat-cons'+active+'" onclick="setCategory(\''+key+'\')" translate="no">'+escapeHtml(label)+'</button>';
    }).join('');
    let titleText;
    if(currentCategory){
      const longLabel=window.GomnaBibleCategories.getLabel(currentCategory,lang);
      titleText=longLabel+' ('+filtered.length+')';
    }else{
      titleText=allLabel+' (66)';
    }
    b.innerHTML='<!-- gomna-easy-modal v27 :: 7-row grid, OT|NT headers, no emojis -->'+
      '<div class="cons-grid cat-cons-grid">'+allBtn+otHdr+ntHdr+catBtns+'</div>'+
      '<div class="cons-label" translate="no">'+escapeHtml(titleText)+'</div>'+
      '<div class="book-grid">'+filtered.map(bk=>'<button class="book-item" onclick="clickBook(\''+bk[0]+'\')">'+bk[0]+'<small>'+bk[1]+'장</small></button>').join('')+'</div>';
    return;
  }
  // Fallback (translate_feature.js not loaded yet) — use the legacy consonant view.
  const filtered=currentCons==='전체'?allBooks:allBooks.filter(bk=>getConsonant(bk[0])===currentCons);
  const labelText=currentCons==='전체'?'전체 성경 (66권)':currentCons+'으로 시작하는 책 ('+filtered.length+'권)';
  b.innerHTML='<div class="cons-grid">'+consonants.map(c=>'<button class="cons'+(c===currentCons?' active':'')+'" onclick="setCons(\''+c+'\')">'+c+'</button>').join('')+'</div><div class="cons-label">'+labelText+'</div><div class="book-grid">'+filtered.map(bk=>'<button class="book-item" onclick="clickBook(\''+bk[0]+'\')">'+bk[0]+'<small>'+bk[1]+'장</small></button>').join('')+'</div>';
}
function setCategory(key){currentCategory=key;renderEasy();}
function setCons(c){currentCons=c;renderEasy();}
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});}
function clickBook(name){window.location.href='reader.html?book='+encodeURIComponent(name);}
function activateSearch(){const i=document.getElementById('homeSearchInput');if(i)i.focus();}
function submitSearch(e){if(e)e.preventDefault();const i=document.getElementById('homeSearchInput');const q=i?i.value.trim():'';if(!q){activateSearch();return;}window.location.href='reader.html?q='+encodeURIComponent(q);}
function topic(name){window.location.href='reader.html?q='+encodeURIComponent(name);}
function openSettings(){var p=document.getElementById('settingsPopup');if(p)p.classList.add('show');}
function closeSettings(){var p=document.getElementById('settingsPopup');if(p)p.classList.remove('show');}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}
</script>
<script src="settings_guide.js" defer></script>
<script src="translate_feature.js" defer></script>
</body>
