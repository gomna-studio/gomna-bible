*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

<script>
const oldData=[{cat:'📜 모세오경',books:[['창세기',50],['출애굽기',40],['레위기',27],['민수기',36],['신명기',34]]},{cat:'📜 역사서',books:[['여호수아',24],['사사기',21],['룻기',4],['사무엘상',31],['사무엘하',24],['열왕기상',22],['열왕기하',25],['역대상',29],['역대하',36],['에스라',10],['느헤미야',13],['에스더',10]]},{cat:'📜 시가서',books:[['욥기',42],['시편',150],['잠언',31],['전도서',12],['아가',8]]},{cat:'📜 대선지서',books:[['이사야',66],['예레미야',52],['예레미야애가',5],['에스겔',48],['다니엘',12]]},{cat:'📜 소선지서',books:[['호세아',14],['요엘',3],['아모스',9],['오바댜',1],['요나',4],['미가',7],['나훔',3],['하박국',3],['스바냐',3],['학개',2],['스가랴',14],['말라기',4]]}];
const newData=[{cat:'📖 복음서',books:[['마태복음',28],['마가복음',16],['누가복음',24],['요한복음',21]]},{cat:'📖 역사서',books:[['사도행전',28]]},{cat:'📖 바울서신',books:[['로마서',16],['고린도전서',16],['고린도후서',13],['갈라디아서',6],['에베소서',6],['빌립보서',4],['골로새서',4],['데살로니가전서',5],['데살로니가후서',3],['디모데전서',6],['디모데후서',4],['디도서',3],['빌레몬서',1]]},{cat:'📖 일반서신',books:[['히브리서',13],['야고보서',5],['베드로전서',5],['베드로후서',3],['요한일서',5],['요한이서',1],['요한삼서',1],['유다서',1]]},{cat:'📖 예언서',books:[['요한계시록',22]]}];
const allBooks=[['창세기',50],['출애굽기',40],['레위기',27],['민수기',36],['신명기',34],['여호수아',24],['사사기',21],['룻기',4],['사무엘상',31],['사무엘하',24],['열왕기상',22],['열왕기하',25],['역대상',29],['역대하',36],['에스라',10],['느헤미야',13],['에스더',10],['욥기',42],['시편',150],['잠언',31],['전도서',12],['아가',8],['이사야',66],['예레미야',52],['예레미야애가',5],['에스겔',48],['다니엘',12],['호세아',14],['요엘',3],['아모스',9],['오바댜',1],['요나',4],['미가',7],['나훔',3],['하박국',3],['스바냐',3],['학개',2],['스가랴',14],['말라기',4],['마태복음',28],['마가복음',16],['누가복음',24],['요한복음',21],['사도행전',28],['로마서',16],['고린도전서',16],['고린도후서',13],['갈라디아서',6],['에베소서',6],['빌립보서',4],['골로새서',4],['데살로니가전서',5],['데살로니가후서',3],['디모데전서',6],['디모데후서',4],['디도서',3],['빌레몬서',1],['히브리서',13],['야고보서',5],['베드로전서',5],['베드로후서',3],['요한일서',5],['요한이서',1],['요한삼서',1],['유다서',1],['요한계시록',22]];
const consonants=['전체','ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ','ㅈ','ㅊ','ㅎ'];
let easyOpenTimer=null;
function getConsonant(name){const c=name.charCodeAt(0);if(c<0xAC00||c>0xD7A3)return null;const idx=Math.floor((c-0xAC00)/588);const map=['ㄱ','ㄱ','ㄴ','ㄷ','ㄷ','ㄹ','ㅁ','ㅂ','ㅂ','ㅅ','ㅅ','ㅇ','ㅈ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];return map[idx]||null;}
let currentCons='전체';
var fontSize = 17;
const hour=new Date().getHours();
let greetText='— 좋은 아침입니다 —';
if(hour>=12&&hour<18)greetText='— 평안한 오후입니다 —';
else if(hour>=18||hour<5)greetText='— 고요한 저녁입니다 —';
document.getElementById('greeting').textContent=greetText;
var _fd=document.getElementById('fontDisplay');
if(_fd) _fd.textContent=fontSize+'px';
function playVerseAnimation(){const tag=document.getElementById('verse-tag');const text=document.getElementById('verse-text');const ref=document.getElementById('verse-ref');[tag,text,ref].forEach(el=>{el.style.animation='none';el.style.opacity='0';el.style.transform='translateY(10px)';});void tag.offsetWidth;setTimeout(()=>{tag.style.animation='textRise 1.1s cubic-bezier(.22,.7,.3,1) forwards';},50);setTimeout(()=>{text.style.animation='textRise 1.2s cubic-bezier(.22,.7,.3,1) forwards';},450);setTimeout(()=>{ref.style.animation='textRise 1s cubic-bezier(.22,.7,.3,1) forwards';},950);}
function staggerWords(elId,text,baseDelay){const el=document.getElementById(elId);const chars=text.split('');el.style.opacity='1';el.innerHTML=chars.map((c,i)=>{if(c===' ')return ' ';return '<span class="word" style="animation-delay:'+(baseDelay+i*55)+'ms">'+c+'</span>';}).join('');}
function playWelcomeAnimation(){staggerWords('welcome1','은혜의말씀 안에서',0);staggerWords('welcome2','하나님의 놀라운 세계가 펼쳐집니다',800);}
let verseCount=0;
function playVerseAndCheck(){
  playVerseAnimation();
  verseCount++;
  if(verseCount%2===0){setTimeout(playWelcomeAnimation,2000);}
}
setTimeout(()=>{playVerseAnimation();setInterval(playVerseAndCheck,8000);},1000);
setTimeout(()=>{playWelcomeAnimation();},3000);
function openBible(testament){
  window.location.href='reader.html?testament='+encodeURIComponent(testament);
}
function openEasy(initialCons){const lamp=document.getElementById('lamp');if(lamp&&lamp.classList.contains('lit'))return;if(easyOpenTimer)clearTimeout(easyOpenTimer);if(lamp)lamp.classList.add('lit');easyOpenTimer=setTimeout(()=>{easyOpenTimer=null;switchTab('easy',initialCons);document.getElementById('overlay').classList.add('show');},900);}
function closeSheet(){if(easyOpenTimer){clearTimeout(easyOpenTimer);easyOpenTimer=null;}document.getElementById('overlay').classList.remove('show');setTimeout(()=>{document.getElementById('book-old').classList.remove('opening');document.getElementById('book-new').classList.remove('opening');const lamp=document.getElementById('lamp');if(lamp)lamp.classList.remove('lit');},400);}
function closeIfBg(e){if(e.target.id==='overlay')closeSheet();}
function switchTab(tab,easyInitialCons){document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));const b=document.getElementById('sheet-body');if(tab==='old'){b.innerHTML=oldData.map(c=>'<div class="cat"><div class="cat-title">'+c.cat+'</div><div class="book-grid">'+c.books.map(bk=>'<button class="book-item" onclick="clickBook(\''+bk[0]+'\')">'+bk[0]+'<small>'+bk[1]+'장</small></button>').join('')+'</div></div>').join('');}else if(tab==='new'){b.innerHTML=newData.map(c=>'<div class="cat"><div class="cat-title">'+c.cat+'</div><div class="book-grid">'+c.books.map(bk=>'<button class="book-item" onclick="clickBook(\''+bk[0]+'\')">'+bk[0]+'<small>'+bk[1]+'장</small></button>').join('')+'</div></div>').join('');}else if(tab==='easy'){currentCons=(easyInitialCons!==undefined&&easyInitialCons!==null)?easyInitialCons:'전체';renderEasy();}else{b.innerHTML='<div class="bookmark-empty"><div class="icon">★</div>아직 저장한 말씀이 없습니다.<br>마음에 닿은 구절을 ★로 저장해보세요.</div>';}b.scrollTop=0;}
function renderEasy(){const filtered=currentCons==='전체'?allBooks:allBooks.filter(bk=>getConsonant(bk[0])===currentCons);const b=document.getElementById('sheet-body');const labelText=currentCons==='전체'?'전체 성경 (66권)':currentCons+'으로 시작하는 책 ('+filtered.length+'권)';b.innerHTML='<div class="cons-grid">'+consonants.map(c=>'<button class="cons'+(c===currentCons?' active':'')+'" onclick="setCons(\''+c+'\')">'+c+'</button>').join('')+'</div><div class="cons-label">'+labelText+'</div><div class="book-grid">'+filtered.map(bk=>'<button class="book-item" onclick="clickBook(\''+bk[0]+'\')">'+bk[0]+'<small>'+bk[1]+'장</small></button>').join('')+'</div>';}
function setCons(c){currentCons=c;renderEasy();}
function clickBook(name){window.location.href='reader.html?book='+encodeURIComponent(name);}
function activateSearch(){const i=document.getElementById('homeSearchInput');if(i)i.focus();}
function submitSearch(e){if(e)e.preventDefault();const i=document.getElementById('homeSearchInput');const q=i?i.value.trim():'';if(!q){activateSearch();return;}window.location.href='reader.html?q='+encodeURIComponent(q);}
function topic(name){window.location.href='reader.html?q='+encodeURIComponent(name);}
function openSettings(){var p=document.getElementById('settingsPopup');if(p)p.classList.add('show');}
function closeSettings(){var p=document.getElementById('settingsPopup');if(p)p.classList.remove('show');}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}
</script>
