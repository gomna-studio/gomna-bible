})();

/* Match the keypad's TOP and BOTTOM exactly to the .book covers in the
   neighbouring cards. .book uses height:80% inside .stage with the
   parent's align-items:center vertically centring it. The .stage uses
   flex:1 in its parent .card, so we must give .stage min-height:0 to
   prevent it from being pushed taller by the keypad's content (default
   flex min-height:auto would let stage grow). With this, both .book
   and .cat-keypad resolve their height:80% against the SAME .stage
   height, giving pixel-perfect alignment across all 3 cards. */
.card.easy .stage{min-height:0;overflow:hidden}
.card.easy .easy-keypad.cat-keypad{flex:none;width:100%;height:80%;min-height:0;grid-template-rows:repeat(5,minmax(0,1fr));align-content:stretch;gap:3px}
.card.easy .easy-keypad.cat-keypad > .easy-key.cat-key{min-height:0;height:100%}
.easy-key:hover{transform:scale(1.1)}

/* 말씀 이어가기 카드 */
.home-resume-card{display:block;width:100%;background:var(--gm-card-bg);border:var(--gm-card-border-slim);border-radius:var(--gm-radius-card);box-shadow:var(--gm-card-shadow);padding:10px 11px 9px;margin-bottom:8px;font-family:inherit;text-align:left;box-sizing:border-box;pointer-events:auto}
.home-resume-split{display:grid;grid-template-columns:1fr 1fr;gap:0;min-width:0;width:100%;align-items:stretch}
.home-resume-pane{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;min-width:0;min-height:100%;background:transparent;border:0;padding:1px 8px 1px 0;margin:0;cursor:pointer;font-family:inherit;text-align:left;-webkit-tap-highlight-color:transparent;border-radius:8px;transition:background .18s ease}
.home-resume-pane + .home-resume-pane{padding:1px 0 1px 10px;border-left:1px solid rgba(168,122,53,.28)}
.home-resume-pane:hover{background:rgba(200,152,73,.06)}
.home-resume-pane:active{background:rgba(200,152,73,.1)}
.home-resume-kicker{display:flex;align-items:center;gap:5px;min-width:0;max-width:100%;margin:0 0 3px}
.home-resume-pane-icon{width:15px;height:15px;flex-shrink:0;display:block;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.home-resume-pane-icon--read{stroke:#3F2A12;opacity:.88}
.home-resume-pane-icon--listen{stroke:#234A52;opacity:.82}
.home-resume-kicker-text{min-width:0;font-size:11px;font-weight:600;color:#8a6e4a;letter-spacing:-.15px;line-height:1.2}
.home-resume-loc{min-width:0;margin:0;font-size:clamp(12.5px,3.3vw,14px);font-weight:700;color:#2a1c0c;letter-spacing:-.25px;line-height:1.3;word-break:keep-all;overflow-wrap:anywhere;white-space:normal}
.home-resume-time{font-size:11px;color:#9a7a52;margin-top:3px;letter-spacing:-.15px;line-height:1.25;white-space:nowrap}
.home-resume-cta{display:inline-flex;align-items:center;gap:0;margin-top:5px;font-size:12px;font-weight:600;color:#a87a35;letter-spacing:-.15px;line-height:1.2;white-space:nowrap;max-width:100%}
.home-resume-cta-text{min-width:0}
.home-resume-cta-arrow{display:inline-block;position:relative;width:1.3em;height:.72em;margin-left:.28em;flex-shrink:0;vertical-align:middle;color:currentColor}
.home-resume-cta-arrow::before{content:"";position:absolute;left:0;right:.32em;top:50%;height:2px;background:currentColor;border-radius:1px;transform:translateY(-50%);opacity:1}
.home-resume-cta-arrow::after{content:"";position:absolute;right:0;top:50%;width:.42em;height:.42em;border-right:2px solid currentColor;border-top:2px solid currentColor;transform:translateY(-50%) rotate(45deg);opacity:1}
.home-resume-cta-play{display:inline-block;margin-left:.28em;flex-shrink:0;font-size:1em;line-height:1;color:currentColor}
.home-resume-card.home-resume--no-read .home-resume-loc,
.home-resume-card.home-resume--no-listen .home-resume-loc{color:#6e5536;font-weight:600}
.home-resume-card.home-resume--no-read .home-resume-time,
.home-resume-card.home-resume--no-listen .home-resume-time{opacity:.72}
.home-resume-card.home-resume--no-read .home-resume-cta,
.home-resume-card.home-resume--no-listen .home-resume-cta{opacity:.78}
.home-resume-recent{display:flex;align-items:flex-start;gap:6px;width:100%;margin-top:8px;padding-top:7px;border-top:1px solid rgba(180,140,90,.14);box-sizing:border-box}
.home-resume-recent-label{flex-shrink:0;margin-top:3px;font-size:10px;font-weight:600;color:#8a6e4a;letter-spacing:-.1px;line-height:1.2}
.home-resume-recent-chips{display:flex;flex-wrap:wrap;gap:5px;min-width:0;flex:1}
.home-resume-recent-chip{appearance:none;-webkit-appearance:none;margin:0;padding:3px 7px;border:1px solid rgba(180,140,90,.28);border-radius:999px;background:rgba(200,152,73,.08);color:#3d2818;font:inherit;font-size:11px;font-weight:600;letter-spacing:-.15px;line-height:1.25;cursor:pointer;-webkit-tap-highlight-color:transparent}
.home-resume-recent-chip:active{background:rgba(200,152,73,.16)}
.home-resume-recent-empty{font-size:11.5px;font-weight:450;color:#9a7a52;letter-spacing:-.15px;line-height:1.3;padding:2px 0}
.home-resume-pane:hover .home-resume-loc,
.home-resume-pane:hover .home-resume-cta{color:#5a3818}
@media (max-width:360px){
  .home-resume-card{padding:9px 9px 8px}
  .home-resume-kicker{gap:4px}
  .home-resume-pane-icon{width:14px;height:14px}
  .home-resume-loc{font-size:clamp(12px,3.4vw,13px)}
  .home-resume-time{font-size:10.5px}
  .home-resume-cta{font-size:11.5px;margin-top:4px}
  .home-resume-pane + .home-resume-pane{padding-left:8px}

.imprint-bottom{margin-top:18px;padding-top:14px;padding-bottom:30px;border-top:.5px solid rgba(255,255,255,.18);text-align:center}
@keyframes gs-imprint-underline{
  0%{width:0;left:0;opacity:0}
  14%{width:0;left:0;opacity:1}
  52%{width:100%;left:0;opacity:1}
  70%{width:0;left:100%;opacity:1}
  76%{width:0;left:100%;opacity:0}
  100%{width:0;left:100%;opacity:0}
}

  0%,14%{transform:translate(0,0);opacity:.72}

  42%{transform:translate(3px,-2.5px);opacity:1}
  56%{transform:translate(1.4px,-1.1px);opacity:.92}

}
.gs-link{font-family:monospace;font-size:11px;font-weight:400;letter-spacing:0.05em;display:inline-flex;align-items:center;justify-content:center;gap:5px;max-width:100%;min-height:40px;padding:10px 14px;margin:-4px 0;text-decoration:none;cursor:pointer;transition:transform .35s ease,background .2s ease;position:relative;border-radius:8px;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

<script>
(function(){
  'use strict';

  var banner = document.getElementById('home-cookie-banner');
  var acceptButton = document.getElementById('home-cookie-accept');
  var rejectButton = document.getElementById('home-cookie-reject');

  function readCookieChoice() {
    try {
      var raw = localStorage.getItem('cookieChoice');
      if (!raw) return null;
      var parsed = JSON.parse(raw);
      return parsed && typeof parsed === 'object' ? parsed : null;
    } catch (error) {
      return null;
    }
  }

  function hasStoredAnalyticsChoice() {
    var choice = readCookieChoice();
    return !!(choice && typeof choice.analytics === 'boolean');
  }

  function hideBanner() {
    if (banner) banner.hidden = true;
  }

  function saveAnalyticsChoice(analytics) {
    var choice = readCookieChoice() || {};
    choice.analytics = analytics;
    choice.timestamp = new Date().toISOString();
    localStorage.setItem('cookieChoice', JSON.stringify(choice));
  }

  function acceptAnalyticsCookies() {
    saveAnalyticsChoice(true);
    hideBanner();
    if (typeof window.GomnaHomeAnalyticsInit === 'function') {
      window.GomnaHomeAnalyticsInit();
    }
  }

  function rejectAnalyticsCookies() {
    saveAnalyticsChoice(false);
    hideBanner();
  }

  if (!hasStoredAnalyticsChoice() && banner) {
    banner.hidden = false;
  }

  if (acceptButton) acceptButton.addEventListener('click', acceptAnalyticsCookies);
  if (rejectButton) rejectButton.addEventListener('click', rejectAnalyticsCookies);
})();
</script>

function getVerseForDate(d){return DAILY_VERSES[((d.getDate()-1)%30+30)%30];}
function _localDay(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function _isSameDate(a,b){const aa=_localDay(a),bb=_localDay(b);return aa.getTime()===bb.getTime();}
let _selectedDate;
let _hasUserSelectedDailyDate=false;
let _calendarMonth=new Date();
let _dailyVerseFitRaf=0;
let _dailyVerseFitResizeBound=false;
function _dailyVerseMinFontPx(){
  try{
    return window.matchMedia('(max-width: 480px)').matches?13:15;
  }catch(e){
    return 15;
  }
}
function _dailyVerseOverflows(txt,center){
  if(!txt)return false;
  if(txt.scrollHeight>txt.clientHeight+1)return true;
  if(center&&center.scrollHeight>center.clientHeight+1)return true;
  return false;
}
function fitDailyVerseText(){
  const txt=document.getElementById('verse-text');
  if(!txt)return;
  const center=txt.closest('.verse-center');
  // Reset to stylesheet default, then shrink only if needed.
  txt.style.fontSize='';
  txt.style.lineHeight='';
  const base=parseFloat(window.getComputedStyle(txt).fontSize)||14.5;
  const minPx=_dailyVerseMinFontPx();
  let size=base;
  const lh=parseFloat(window.getComputedStyle(txt).lineHeight);
  const baseLhRatio=(lh&&base)?(lh/base):1.42;
  const minLhRatio=1.32;
  while(_dailyVerseOverflows(txt,center)&&size>minPx+0.001){
    size=Math.max(minPx, Math.round((size-0.5)*2)/2);
    txt.style.fontSize=size+'px';
    txt.style.lineHeight=String(Math.max(minLhRatio, baseLhRatio));
  }
  if(_dailyVerseOverflows(txt,center)){
    try{
      console.warn('[gomna] daily verse still overflows at min font', {
        minPx:minPx,
        width:window.innerWidth,
        ref:(document.getElementById('verse-ref')||{}).textContent||'',
        preview:(txt.textContent||'').slice(0,80)
      });
    }catch(e){}
  }
}
function scheduleFitDailyVerseText(){
  if(_dailyVerseFitRaf)cancelAnimationFrame(_dailyVerseFitRaf);
  _dailyVerseFitRaf=requestAnimationFrame(function(){
    _dailyVerseFitRaf=0;
    fitDailyVerseText();
  });
}
function ensureDailyVerseFitResizeListener(){
  if(_dailyVerseFitResizeBound)return;
  _dailyVerseFitResizeBound=true;
  window.addEventListener('resize',function(){
    if(_dailyVerseFitRaf)cancelAnimationFrame(_dailyVerseFitRaf);
    _dailyVerseFitRaf=requestAnimationFrame(function(){
      _dailyVerseFitRaf=0;
      fitDailyVerseText();
    });
  },{passive:true});
  window.addEventListener('orientationchange',function(){
    scheduleFitDailyVerseText();
  },{passive:true});
}
function _setVerseDOM(d){
  const selDate=_localDay(d);
  _selectedDate=selDate;
  const isToday=_isSameDate(selDate,new Date());
  const v=getVerseForDate(selDate);
  const nativeActive=document.documentElement.classList.contains('gomna-native-i18n-active');
  const lang=(nativeActive&&window.GomnaUII18n)
    ? (window.GomnaUII18n.getLanguage()||'ko')
    : (window.__gomnaLastLang||'ko');
  const tag=document.getElementById('verse-tag');
  if(tag){
    // Tag is locale-formatted manually (custom translation + Intl date),
    // so we keep translate="no" to prevent Google from double-translating.
    const tagText=(typeof window.GomnaTranslateVerseTag==='function')
      ? window.GomnaTranslateVerseTag(d,isToday,lang)
      : (isToday?'오늘의 말씀':((d.getMonth()+1)+'월 '+d.getDate()+'일의 말씀'));
    tag.textContent=tagText;
    tag.setAttribute('translate','no');
    if(isToday)tag.setAttribute('data-i18n-key','home.todayWord.tag');
    else tag.removeAttribute('data-i18n-key');
  }
  const txt=document.getElementById('verse-text');
  const ref=document.getElementById('verse-ref');
  const nativeLang=(nativeActive&&(lang==='ko'||lang==='en'||lang==='ja'))?lang:null;
  let body=v.t;
  let bodyLang='ko';
  let bibleVersion='KRV';
  let refText=v.r;
  if(nativeLang==='en'&&v.i18n&&v.i18n.en){
    body=v.i18n.en;
    bodyLang='en';
    bibleVersion='WEBP';
    refText=(typeof window.GomnaTranslateBookRef==='function')?window.GomnaTranslateBookRef(v.r,'en'):v.r;
  }else if(nativeLang==='ja'&&v.i18n&&v.i18n.ja){
    body=v.i18n.ja;
    bodyLang='ja';
    bibleVersion='Kougo-1954-1955';
    refText=(typeof window.GomnaTranslateBookRef==='function')?window.GomnaTranslateBookRef(v.r,'ja'):v.r;
  }else if(nativeLang==='ko'){
    body=v.t;
    bodyLang='ko';
    bibleVersion='KRV';
    refText=v.r;
  }else{
    // Unsupported / Google fallback: Korean body remains GT target.
    body=v.t;
    refText=(typeof window.GomnaTranslateBookRef==='function')
      ? window.GomnaTranslateBookRef(v.r,lang)
      : v.r;
  }
  if(txt){
    txt.textContent='"'+body+'"';
    if(nativeLang){
      txt.setAttribute('translate','no');
      txt.setAttribute('lang',bodyLang);
      txt.setAttribute('data-bible-version',bibleVersion);
    }else{
      txt.removeAttribute('translate');
      txt.removeAttribute('lang');
      txt.removeAttribute('data-bible-version');
    }
  }
  if(ref){
    ref.textContent='— '+refText;
    ref.setAttribute('translate','no');
    if(nativeLang){
      ref.setAttribute('lang',bodyLang);
      ref.setAttribute('data-bible-version',bibleVersion);
    }else{
      ref.removeAttribute('lang');
      ref.removeAttribute('data-bible-version');
    }
  }
  const todayBtn=document.getElementById('verseTodayBtn');
  if(todayBtn)todayBtn.style.display=(_hasUserSelectedDailyDate&&!isToday)?'inline-block':'none';
  ensureDailyVerseFitResizeListener();
  scheduleFitDailyVerseText();
}
function resetVerseToToday(){_hasUserSelectedDailyDate=false;applyVerseForDate(new Date());}
const _MONTHS=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
function renderCalendar(year,month){
  const grid=document.getElementById('calGrid');
  const title=document.getElementById('calTitle');
  if(!grid||!title)return;
  const lang=_homeUiLang();
  if(window.GomnaUII18n&&typeof window.GomnaUII18n.formatCalendarMonth==='function'&&document.documentElement.classList.contains('gomna-native-i18n-active')){
    title.textContent=window.GomnaUII18n.formatCalendarMonth(year,month,lang);
  }else{
    title.textContent=year+'년 '+_MONTHS[month];
  }
  const startWd=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const today=new Date();
  let html='';
  for(let i=0;i<startWd;i++)html+='<button type="button" class="cal-cell empty" tabindex="-1" aria-hidden="true"></button>';
  for(let d=1;d<=daysInMonth;d++){
    const wd=new Date(year,month,d).getDay();
    const cls=['cal-cell'];
    if(wd===0)cls.push('sun');else if(wd===6)cls.push('sat');
    if(today.getFullYear()===year&&today.getMonth()===month&&today.getDate()===d)cls.push('today');
    if(_selectedDate.getFullYear()===year&&_selectedDate.getMonth()===month&&_selectedDate.getDate()===d)cls.push('selected');
    var dayAria=(month+1)+'월 '+d+'일';
    if(window.GomnaUII18n&&typeof window.GomnaUII18n.formatCalendarDayAria==='function'&&document.documentElement.classList.contains('gomna-native-i18n-active')){
      dayAria=window.GomnaUII18n.formatCalendarDayAria(month+1,d,lang);
    }
    html+='<button type="button" class="'+cls.join(' ')+'" data-d="'+d+'" aria-label="'+escapeHtml(dayAria)+'">'+d+'</button>';
  }
  grid.innerHTML=html;
  grid.querySelectorAll('.cal-cell:not(.empty)').forEach(function(c){
    c.addEventListener('click',function(){
      const d=parseInt(c.getAttribute('data-d'),10);
      _hasUserSelectedDailyDate=true;
      applyVerseForDate(new Date(_calendarMonth.getFullYear(),_calendarMonth.getMonth(),d));
      closeVerseDatePicker();
    });
  });
}
function navMonth(delta){
  _calendarMonth=new Date(_calendarMonth.getFullYear(),_calendarMonth.getMonth()+delta,1);
  renderCalendar(_calendarMonth.getFullYear(),_calendarMonth.getMonth());
}
function openVerseDatePicker(){
  _calendarMonth=new Date(_selectedDate.getFullYear(),_selectedDate.getMonth(),1);

function closeVerseDatePicker(){document.getElementById('versePopup').classList.remove('show');}
document.addEventListener('keydown',function(e){if(e.key==='Escape'){const p=document.getElementById('versePopup');if(p&&p.classList.contains('show'))closeVerseDatePicker();}});
function scrollToTodayWordCardFromHash(){if(location.hash!=='#today-word-card')return;const card=document.getElementById('today-word-card');if(!card)return;const scrollFn=function(){try{card.scrollIntoView({behavior:'smooth',block:'center'});}catch(e){card.scrollIntoView();}};requestAnimationFrame(function(){setTimeout(scrollFn,80);});}

scrollToTodayWordCardFromHash();

// (e.g. "오늘의 말씀" → "Today's Word") and the reference book name (e.g.
// "마태복음 11:28" → "Matthew 11:28") update in real time. translate_feature.js
// calls this hook at the end of applyUiTextI18n().
window.__gomnaOnLangApplied=function(){
  try{_setVerseDOM(_selectedDate||new Date());}catch(e){}
};

// ─── 오늘의 말씀 버튼: 책/장 파싱 후 reader.html 이동 (1차: 직접 재생/팝업 없음) ───
function getDailyVerseTarget(){
  const v=getVerseForDate(_selectedDate||new Date());
  const r=(v&&v.r||'').trim();
  const m=r.match(/^(.+?)\s+(\d+):(\d+)(?:-(\d+))?$/);
  if(!m)return null;
  const startVerse=parseInt(m[3],10);
  const endVerse=m[4]?parseInt(m[4],10):startVerse;
  return{book:m[1].trim(),chapter:parseInt(m[2],10),verse:startVerse,startVerse,endVerse};
}
function openDailyVerse(mode){
  if(mode==='listen'){
    const params=new URLSearchParams();
    params.set('book','창세기');
    params.set('chapter','1');
    params.set('verse','1');
    params.set('startVerse','1');
    params.set('endVerse','1');
    params.set('listen','1');
    params.set('source','home-main-listen');
    window.location.href='reader.html?'+params.toString();
    return;
  }
  if(mode==='commentary'){
    const params=new URLSearchParams();
    params.set('book','창세기');
    params.set('chapter','1');
    params.set('verse','1');
    params.set('commentary','1');
    params.set('source','home-main-commentary');
    window.location.href='reader.html?'+params.toString();
    return;
  }
  const t=getDailyVerseTarget();
  if(!t){window.location.href='reader.html';return;}
  const params=new URLSearchParams();
  params.set('book',t.book);
  params.set('chapter',String(t.chapter));
  params.set('verseStart',String(t.startVerse));
  params.set('verse',String(t.startVerse));
  params.set('source','home-daily-read');
  window.location.href='reader.html?'+params.toString();
}

function scrollToTopics(){

  const target=shell||searchForm;
  if(target)target.scrollIntoView({behavior:'smooth',block:'center'});
  setTimeout(function(){
    if(searchInput){
      try{searchInput.focus({preventScroll:true});}catch(e){searchInput.focus();}
    }
    if(shell)shell.classList.add('topic-search-open');
    if(panel){
      panel.classList.remove('topic-panel-reveal');
      void panel.offsetWidth;
      panel.classList.add('topic-panel-reveal');
    }

      searchForm.classList.remove('search-attention');
      void searchForm.offsetWidth;
      searchForm.classList.add('search-attention');
      setTimeout(function(){searchForm.classList.remove('search-attention');},1800);

    topicSearchCloseTimer=setTimeout(function(){closeInlineTopics();},6500);

<script>
(function(){
  'use strict';
  var GLOBE_SRC='images/home/globe.png';
  var globeObserver=null;
  var globePollTimer=null;
  function stopGlobeWatch(){
    if(globeObserver){globeObserver.disconnect();globeObserver=null;}
    if(globePollTimer){clearInterval(globePollTimer);globePollTimer=null;}
  }
  function decorateGlobeBtn(btn){
    if(!btn||btn.dataset.globeDecorated==='true')return true;
    btn.dataset.gtHomeStyled='1';
    btn.classList.add('gt-btn-home-custom');
    var oldImg=btn.querySelector('.gt-globe-img');
    if(oldImg)oldImg.style.display='none';
    var wrap=btn.querySelector('.gt-home-globe-wrap');
    if(!wrap){
      wrap=document.createElement('span');
      wrap.className='gt-home-globe-wrap';
      var spin=document.createElement('span');
      spin.className='gt-home-globe-spin';
      var img=document.createElement('img');
      img.className='gt-home-globe';
      img.src=GLOBE_SRC;
      img.alt='';
      img.setAttribute('aria-hidden','true');
      img.decoding='async';
      var ring=document.createElement('span');
      ring.className='gt-home-globe-ring';
      ring.setAttribute('aria-hidden','true');
      spin.appendChild(img);
      spin.appendChild(ring);
      wrap.appendChild(spin);
      btn.insertBefore(wrap,btn.firstChild);
    }
    var label=btn.querySelector('.gt-home-lang-label');
    if(!label){
      label=document.createElement('span');
      label.className='gt-home-lang-label';
      btn.appendChild(label);
    }
    label.setAttribute('data-i18n-key','language.short');
    btn.setAttribute('data-i18n-aria-label','language.openAria');
    btn.setAttribute('data-i18n-title','language.openAria');
    var shortLabel='언어';
    var openAria='언어 선택';
    if(window.GomnaUII18n&&document.documentElement.classList.contains('gomna-native-i18n-active')){
      shortLabel=window.GomnaUII18n.t('language.short')||shortLabel;
      openAria=window.GomnaUII18n.t('language.openAria')||openAria;
      label.setAttribute('translate','no');
      btn.setAttribute('translate','no');
      if(!btn.getAttribute('data-gomna-native-translate-owned'))btn.setAttribute('data-gomna-native-translate-owned','1');
      if(!label.getAttribute('data-gomna-native-translate-owned'))label.setAttribute('data-gomna-native-translate-owned','1');
    }
    label.textContent=shortLabel;
    btn.setAttribute('aria-label',openAria);
    btn.setAttribute('title',openAria);
    btn.dataset.globeDecorated='true';
    return true;
  }
  function syncGlobeI18n(){
    var btns=document.querySelectorAll('.header .gt-btn');
    for(var i=0;i<btns.length;i++){
      var btn=btns[i];
      var label=btn.querySelector('.gt-home-lang-label');
      if(!label)continue;
      label.setAttribute('data-i18n-key','language.short');
      btn.setAttribute('data-i18n-aria-label','language.openAria');
      btn.setAttribute('data-i18n-title','language.openAria');
      var shortLabel='언어';
      var openAria='언어 선택';
      if(window.GomnaUII18n&&document.documentElement.classList.contains('gomna-native-i18n-active')){
        shortLabel=window.GomnaUII18n.t('language.short')||shortLabel;
        openAria=window.GomnaUII18n.t('language.openAria')||openAria;
        label.setAttribute('translate','no');
        btn.setAttribute('translate','no');
      }
      label.textContent=shortLabel;
      btn.setAttribute('aria-label',openAria);
      btn.setAttribute('title',openAria);
    }
  }
  window.__gomnaSyncGlobeI18n=syncGlobeI18n;
  function tryDecorate(){
    var btns=document.querySelectorAll('.header .gt-btn');
    if(!btns.length)return false;
    var allDone=true;
    btns.forEach(function(btn){if(!decorateGlobeBtn(btn))allDone=false;});
    if(allDone)stopGlobeWatch();
    return allDone;
  }
  function init(){
    if(tryDecorate())return;
    var header=document.querySelector('.header');
    if(window.MutationObserver&&header){
      globeObserver=new MutationObserver(function(muts){
        for(var i=0;i<muts.length;i++){
          var m=muts[i];
          if(m.type!=='childList')continue;
          for(var j=0;j<m.addedNodes.length;j++){
            var n=m.addedNodes[j];
            if(n.nodeType===1&&((n.matches&&n.matches('.gt-btn'))||(n.querySelector&&n.querySelector('.gt-btn')))){
              tryDecorate();
              return;
            }
          }
        }
      });
      globeObserver.observe(header,{childList:true,subtree:true});
    }
    var n=0;
    globePollTimer=setInterval(function(){
      if(tryDecorate()||++n>=40)stopGlobeWatch();
    },100);
  }
  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',function(){setTimeout(init,50);});
  }else{
    setTimeout(init,50);
  }
})();
</script>
