<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>은혜의말씀 · 환영</title>
<style>
  :root{
    --cta:#2F67C7;
    --ink:#1A2332;
    --value-1:#2F5F86;
    --value-2:#3C7A6A;
    --value-3:#8B5E2C;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;
    padding:0;
    min-height:100%;
    background:linear-gradient(180deg, #FCFAF4 0%, #FAF6EC 24%, #F8F1E4 50%, #FAF6EC 76%, #FCFAF4 100%);
  }
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .phone{
    width:min(100%,390px);
    min-height:100svh;
    min-height:100dvh;
    height:100svh;
    height:100dvh;
    max-height:100dvh;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    background:linear-gradient(180deg, #FCFAF4 0%, #FAF6EC 24%, #F8F1E4 50%, #FAF6EC 76%, #FCFAF4 100%);
  }
  .inner{
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    padding:22px 28px calc(16px + env(safe-area-inset-bottom,0px));
  }
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
    flex:0 0 auto;
  }
  .app-icon-frame{
    width:68px;
    height:68px;
    overflow:hidden;
    flex:0 0 auto;
    clip-path:url(#appIconSquircle);
    -webkit-clip-path:url(#appIconSquircle);
  }
  .app-icon-frame img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .brand h1{
    margin:0;
    font-size:21px;
    font-weight:750;
    letter-spacing:-.35px;
    line-height:1.15;
    color:#1A2332;
  }
  .brand p{
    margin:3px 0 0;
    font-family:Georgia,'Times New Roman',serif;
    font-size:12.5px;
    font-style:italic;
    letter-spacing:.35px;
    color:#8A8A8A;
  }
  .hello{
    margin:28px 0 0;
    text-align:center;
    font-size:15px;
    font-weight:700;
    letter-spacing:-.1px;
    color:#2B6B6A;
  }
  .headline{
    margin:10px 0 0;
    text-align:center;
    font-size:26px;
    font-weight:650;
    line-height:1.38;
    letter-spacing:-.45px;
    color:#1A2332;
  }
  .values{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin:22px 0 0;
  }
  .value{
    display:flex;
    align-items:center;
    gap:14px;
    min-height:74px;
    padding:12px 16px;
    background:rgba(255,252,247,.78);
    border:1px solid rgba(180,168,148,.12);
    border-radius:18px;
    box-shadow:0 3px 10px rgba(80,70,50,.04);
  }
  .value svg{
    width:26px;
    height:26px;
    flex:0 0 auto;
    fill:none;
    stroke-width:1.7;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .value.v1 svg{stroke:var(--value-1)}
  .value.v2 svg{stroke:var(--value-2)}
  .value.v3 svg{stroke:var(--value-3)}
  .value p{
    margin:0;
    font-size:15px;
    font-weight:650;
    line-height:1.4;
    letter-spacing:-.25px;
    color:#2A241C;
  }
  .cta{
    width:100%;
    min-height:52px;
    margin:20px 0 0;
    border:0;
    border-radius:14px;
    background:var(--cta);
    color:#fff;
    font:inherit;
    font-size:16.5px;
    font-weight:700;
    letter-spacing:-.2px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .skip{
    margin:12px 0 0;
    border:0;
    background:transparent;
    font:inherit;
    font-size:13.5px;
    font-weight:600;
    color:#6E6A64;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .dots{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    margin-top:auto;
    padding-top:14px;
  }
  .dots i{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#D5D0C8;
  }
  .dots i.is-on{background:var(--cta)}
</style>
</head>
<body>
  <svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
    <defs>
      <clipPath id="appIconSquircle" clipPathUnits="objectBoundingBox">
        <path d="M0.26,0 H0.74 C0.862,0 0.910,0.026 0.942,0.058 C0.974,0.090 1,0.138 1,0.26 V0.74 C1,0.862 0.974,0.910 0.942,0.942 C0.910,0.974 0.862,1 0.74,1 H0.26 C0.138,1 0.090,0.974 0.058,0.942 C0.026,0.910 0,0.862 0,0.74 V0.26 C0,0.138 0.026,0.090 0.058,0.058 C0.090,0.026 0.138,0 0.26,0 Z"></path>
      </clipPath>
    </defs>
  </svg>
  <div class="phone">
    <div class="inner">
      <header class="brand">
        <span class="app-icon-frame"><img src="../assets/login/login-visual-blue.png?v=1" alt="은혜의말씀" width="68" height="68"></span>
        <div>
          <h1>은혜의말씀</h1>
          <p>Words of Grace</p>
        </div>
      </header>
      <p class="hello">환영합니다</p>
      <p class="headline">말씀으로<br>당신의 삶이<br>새로워집니다</p>
      <section class="values" aria-label="핵심 가치">
        <div class="value v1">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.3v13"></path><path d="M12 6.3C10.8 5.5 9.2 5 7.5 5S4.2 5.5 3 6.3v13C4.2 18.5 5.8 18 7.5 18s3.3.5 4.5 1.3"></path><path d="M12 6.3C13.2 5.5 14.8 5 16.5 5s3.3.5 4.5 1.3v13C19.8 18.5 18.2 18 16.5 18s-3.3.5-4.5 1.3"></path></svg>
          <p>오늘의 말씀으로<br>매일 은혜 받기</p>
        </div>
        <div class="value v2">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18v-6a9 9 0 0118 0v6"></path><path d="M21 19a2 2 0 01-2 2h-1a2 2 0 01-2-2v-3a2 2 0 012-2h3zM3 19a2 2 0 002 2h1a2 2 0 002-2v-3a2 2 0 00-2-2H3z"></path></svg>
          <p>읽고, 듣고,<br>함께 나누는 여정</p>
        </div>
        <div class="value v3">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21l-7-4-7 4V5a2 2 0 012-2h10a2 2 0 012 2z"></path></svg>
          <p>어디서든 이어지는<br>나의 기록</p>
        </div>
      </section>
      <button type="button" class="cta" id="startBtn">시작하기</button>
      <button type="button" class="skip" id="skipBtn">로그인 없이 시작</button>
      <div class="dots" aria-hidden="true"><i class="is-on"></i><i></i><i></i><i></i></div>
    </div>
  </div>
  <script>
    document.getElementById('startBtn').addEventListener('click', function(){
      location.href = 'features.html';
    });
    document.getElementById('skipBtn').addEventListener('click', function(){
      try { sessionStorage.removeItem('gomna.preview.flow'); } catch (e) {}
      location.href = '../index.html';
    });
  </script>
</body>
</html>
