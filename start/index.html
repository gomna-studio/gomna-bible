<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>은혜의말씀 · 시작</title>
<style>
  :root{
    --cream:#FBF7EE;
    --cream-deep:#F4EDE0;
    --ink:#1A2332;
    --sub:#8A8A8A;
    --body:#2A2A2A;
    --gold:#6C4B2E;
    --listen:#426B73;
    --comment:#8B5E2C;
    --archive:#2A2A2A;
    --cta:#2F67C7;
    --card:rgba(255,255,255,.94);
    --line:rgba(140,152,164,.14);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;min-height:100%;background:linear-gradient(180deg, #FCFAF4 0%, #FAF6EC 24%, #F8F1E4 50%, #FAF6EC 76%, #FCFAF4 100%)}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .phone{
    width:min(100%,390px);
    min-height:100svh;
    min-height:100dvh;
    height:100svh;
    height:100dvh;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    background:linear-gradient(180deg, #FCFAF4 0%, #FAF6EC 24%, #F8F1E4 50%, #FAF6EC 76%, #FCFAF4 100%);
  }
  .stage{
    flex:1 1 auto;
    min-height:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:clamp(20px,3.2svh,32px) 22px calc(20px + env(safe-area-inset-bottom,0px));
  }
  .top{
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .cluster{
    flex:0 0 auto;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    transform:translateY(24px);
  }
  .lift{
    flex:1.35 1 0;
    width:100%;
    min-height:clamp(20px,3svh,28px);
  }
  .foot{
    flex:0 0 auto;
    width:100%;
  }
  .tail{
    flex:1 1 0;
    width:100%;
    min-height:clamp(40px,16svh,140px);
  }
  .app-icon-frame{
    width:98px;
    height:98px;
    overflow:hidden;
    flex:0 0 auto;
    clip-path:url(#appIconSquircle);
    -webkit-clip-path:url(#appIconSquircle);
  }
  .app-icon-frame img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .brand{
    margin:14px 0 0;
    text-align:center;
  }
  .brand h1{
    margin:0;
    font-size:28px;
    font-weight:750;
    letter-spacing:-.4px;
    line-height:1.15;
    color:#1A2332;
  }
  .brand p{
    margin:6px 0 0;
    font-family:Georgia,'Times New Roman',serif;
    font-size:13.5px;
    font-style:italic;
    letter-spacing:.4px;
    color:var(--sub);
  }
  .lead{
    flex:0 0 auto;
    margin:clamp(16px,2.4svh,22px) 0 0;
    text-align:center;
    font-size:15.5px;
    font-weight:550;
    line-height:1.45;
    letter-spacing:-.2px;
    color:var(--body);
  }
  .features{
    flex:0 0 auto;
    width:100%;
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:6px;
    margin:clamp(18px,2.6svh,24px) 0 0;
  }
  .feature{
    min-width:0;
    text-align:center;
    padding:2px 1px 0;
  }
  .feature svg{
    width:22px;
    height:22px;
    display:block;
    margin:0 auto;
    fill:none;
    stroke-width:1.7;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .feature.read svg{stroke:var(--gold)}
  .feature.listen svg{stroke:var(--listen)}
  .feature.comment svg{stroke:var(--comment)}
  .feature.archive svg{stroke:var(--archive)}
  .feature h3{
    margin:8px 0 4px;
    font-size:12px;
    font-weight:700;
    letter-spacing:-.25px;
    color:#2A2A2A;
  }
  .feature p{
    margin:0;
    font-size:10.5px;
    line-height:1.35;
    letter-spacing:-.2px;
    color:#8A8680;
  }
  .cta{
    width:100%;
    min-height:52px;
    margin:0;
    border:0;
    border-radius:14px;
    background:var(--cta);
    color:#fff;
    font:inherit;
    font-size:16.5px;
    font-weight:700;
    letter-spacing:-.2px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .cta svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
  <svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
    <defs>
      <clipPath id="appIconSquircle" clipPathUnits="objectBoundingBox">
        <path d="M0.26,0 H0.74 C0.862,0 0.910,0.026 0.942,0.058 C0.974,0.090 1,0.138 1,0.26 V0.74 C1,0.862 0.974,0.910 0.942,0.942 C0.910,0.974 0.862,1 0.74,1 H0.26 C0.138,1 0.090,0.974 0.058,0.942 C0.026,0.910 0,0.862 0,0.74 V0.26 C0,0.138 0.026,0.090 0.058,0.058 C0.090,0.026 0.138,0 0.26,0 Z"></path>
      </clipPath>
    </defs>
  </svg>
  <div class="phone">
    <main class="stage">
      <header class="top">
        <span class="app-icon-frame"><img src="../assets/login/login-visual-blue.png?v=1" alt="은혜의말씀" width="98" height="98"></span>
        <div class="brand">
          <h1>은혜의말씀</h1>
          <p>Words of Grace</p>
        </div>
      </header>
      <div class="cluster">
      <p class="lead">성경을 읽고, 듣고,<br>말씀풀이로 깊이 묵상하세요.</p>
      <section class="features" aria-label="주요 기능">
        <div class="feature read">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.3v13"></path><path d="M12 6.3C10.8 5.5 9.2 5 7.5 5S4.2 5.5 3 6.3v13C4.2 18.5 5.8 18 7.5 18s3.3.5 4.5 1.3"></path><path d="M12 6.3C13.2 5.5 14.8 5 16.5 5s3.3.5 4.5 1.3v13C19.8 18.5 18.2 18 16.5 18s-3.3.5-4.5 1.3"></path></svg>
          <h3>성경 읽기</h3>
          <p>말씀을 읽고<br>마음에 새기세요.</p>
        </div>
        <div class="feature listen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18v-6a9 9 0 0118 0v6"></path><path d="M21 19a2 2 0 01-2 2h-1a2 2 0 01-2-2v-3a2 2 0 012-2h3zM3 19a2 2 0 002 2h1a2 2 0 002-2v-3a2 2 0 00-2-2H3z"></path></svg>
          <h3>말씀 듣기</h3>
          <p>말씀을 들으며<br>함께하세요.</p>
        </div>
        <div class="feature comment">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.8h8.2L18.2 6.8V20.2H7V3.8z"></path><path d="M15.2 3.8v3h3"></path><path d="M9.6 11.4h5.3"></path><path d="M9.6 15.1h3.7"></path></svg>
          <h3>말씀풀이</h3>
          <p>말씀을 깊이<br>이해하세요.</p>
        </div>
        <div class="feature archive">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21l-7-4-7 4V5a2 2 0 012-2h10a2 2 0 012 2z"></path></svg>
          <h3>보관함</h3>
          <p>중요한 말씀을<br>보관하세요.</p>
        </div>
      </section>
      </div>
      <div class="lift" aria-hidden="true"></div>
      <div class="foot">
        <button type="button" class="cta" id="startBtn">바로 시작하기<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13"></path><path d="M13 6l6 6-6 6"></path></svg></button>
      </div>
      <div class="tail" aria-hidden="true"></div>
    </main>
  </div>
  <script>
    document.getElementById('startBtn').addEventListener('click', function(){
      location.href = 'today.html';
    });
  </script>
</body>
</html>
