<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>은혜의말씀 · 기능 안내</title>
<style>
  :root{
    --cta:#2F67C7;
    --ink:#1A2332;
    --feat-1:#2F67C7;
    --feat-2:#4D9A5B;
    --feat-3:#2F5F86;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;min-height:100%;background:linear-gradient(180deg, #FCFAF4 0%, #FAF6EC 24%, #F8F1E4 50%, #FAF6EC 76%, #FCFAF4 100%)}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .phone{
    width:min(100%,390px);
    min-height:100dvh;
    height:100dvh;
    max-height:100dvh;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    background:linear-gradient(180deg, #FCFAF4 0%, #FAF6EC 24%, #F8F1E4 50%, #FAF6EC 76%, #FCFAF4 100%);
  }
  .inner{
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    padding:22px 28px calc(16px + env(safe-area-inset-bottom,0px));
  }
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
    flex:0 0 auto;
  }
  .app-icon-frame{
    width:68px;
    height:68px;
    overflow:hidden;
    flex:0 0 auto;
    clip-path:url(#appIconSquircle);
    -webkit-clip-path:url(#appIconSquircle);
  }
  .app-icon-frame img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .brand h1{
    margin:0;
    font-size:21px;
    font-weight:750;
    letter-spacing:-.35px;
    line-height:1.15;
    color:#1A2332;
  }
  .brand p{
    margin:3px 0 0;
    font-family:Georgia,'Times New Roman',serif;
    font-size:12.5px;
    font-style:italic;
    letter-spacing:.35px;
    color:#8A8A8A;
  }
  .headline{
    margin:22px 0 0;
    text-align:center;
    font-size:23px;
    font-weight:650;
    line-height:1.4;
    letter-spacing:-.4px;
    color:#1A2332;
  }
  .sub{
    margin:10px 0 0;
    text-align:center;
    font-size:13.5px;
    font-weight:500;
    line-height:1.45;
    letter-spacing:-.15px;
    color:#8A8680;
  }
  .features{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin:20px 0 0;
  }
  .feature{
    display:flex;
    align-items:center;
    gap:14px;
    min-height:88px;
    padding:14px 16px;
    background:rgba(255,252,247,.78);
    border:1px solid rgba(180,168,148,.12);
    border-radius:18px;
    box-shadow:0 3px 10px rgba(80,70,50,.04);
  }
  .feature svg{
    width:26px;
    height:26px;
    flex:0 0 auto;
    fill:none;
    stroke-width:1.7;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .feature.f1 svg{stroke:var(--feat-1)}
  .feature.f2 svg{stroke:var(--feat-2)}
  .feature.f3 svg{stroke:var(--feat-3)}
  .feature h2{
    margin:0;
    font-size:15.5px;
    font-weight:700;
    letter-spacing:-.25px;
    color:#1A2332;
  }
  .feature p{
    margin:4px 0 0;
    font-size:12.5px;
    font-weight:500;
    line-height:1.4;
    letter-spacing:-.15px;
    color:#6E6A64;
  }
  .cta{
    width:100%;
    min-height:52px;
    margin:18px 0 0;
    border:0;
    border-radius:14px;
    background:var(--cta);
    color:#fff;
    font:inherit;
    font-size:16.5px;
    font-weight:700;
    letter-spacing:-.2px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .skip{
    margin:12px 0 0;
    border:0;
    background:transparent;
    font:inherit;
    font-size:13.5px;
    font-weight:600;
    color:#6E6A64;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .dots{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    margin-top:auto;
    padding-top:14px;
  }
  .dots i{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#D5D0C8;
  }
  .dots i.is-on{background:var(--cta)}
</style>
</head>
<body>
  <svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
    <defs>
      <clipPath id="appIconSquircle" clipPathUnits="objectBoundingBox">
        <path d="M0.26,0 H0.74 C0.862,0 0.910,0.026 0.942,0.058 C0.974,0.090 1,0.138 1,0.26 V0.74 C1,0.862 0.974,0.910 0.942,0.942 C0.910,0.974 0.862,1 0.74,1 H0.26 C0.138,1 0.090,0.974 0.058,0.942 C0.026,0.910 0,0.862 0,0.74 V0.26 C0,0.138 0.026,0.090 0.058,0.058 C0.090,0.026 0.138,0 0.26,0 Z"></path>
      </clipPath>
    </defs>
  </svg>
  <div class="phone">
    <div class="inner">
      <header class="brand">
        <span class="app-icon-frame"><img src="../assets/login/login-visual-blue.png?v=1" alt="은혜의말씀" width="68" height="68"></span>
        <div>
          <h1>은혜의말씀</h1>
          <p>Words of Grace</p>
        </div>
      </header>
      <p class="headline">더 나은 경험을 위해<br>다음 기능을 사용해보세요</p>
      <p class="sub">나에게 꼭 맞는 설정은 언제든 변경할 수 있어요</p>
      <section class="features" aria-label="기능 안내">
        <div class="feature f1">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
          <div>
            <h2>알림</h2>
            <p>말씀 알림과 푸시 알림을 받아<br>은혜의 시간을 놓치지 않아요</p>
          </div>
        </div>
        <div class="feature f2">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M12 8v7.2"></path>
            <path d="M8.6 12.8 12 16.2 15.4 12.8"></path>
          </svg>
          <div>
            <h2>오프라인 저장</h2>
            <p>말씀과 오디오를 저장해<br>오프라인으로도 이용할 수 있어요.</p>
          </div>
        </div>
        <div class="feature f3">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 18v-6a9 9 0 0118 0v6"></path>
            <path d="M21 19a2 2 0 01-2 2h-1a2 2 0 01-2-2v-3a2 2 0 012-2h3zM3 19a2 2 0 002 2h1a2 2 0 002-2v-3a2 2 0 00-2-2H3z"></path>
          </svg>
          <div>
            <h2>오디오 재생</h2>
            <p>말씀을 일상 속에서 자연스럽게 이어 들을 수 있어요.</p>
          </div>
        </div>
      </section>
      <button type="button" class="cta" id="nextBtn">다음</button>
      <button type="button" class="skip" id="skipBtn">건너뛰기</button>
      <div class="dots" aria-hidden="true"><i></i><i class="is-on"></i><i></i><i></i></div>
    </div>
  </div>
  <script>
    function goToRealLogin(){
      try { sessionStorage.setItem('gomna.preview.flow', '1'); } catch (e) {}
      location.href = '../index.html';
    }
    document.getElementById('nextBtn').addEventListener('click', goToRealLogin);
    document.getElementById('skipBtn').addEventListener('click', function(){
      try { sessionStorage.removeItem('gomna.preview.flow'); } catch (e) {}
      location.href = '../index.html';
    });
  </script>
</body>
</html>
