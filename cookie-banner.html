<!-- ==========================
쿠키 배너 (최종 v3 - 간결 + 모두 동의)
- "서비스 개선" 자동 체크
- "맞춤 광고" 미체크
- "모두 동의" 버튼 클릭 1번으로 모두 ON
- "거부" 버튼 = 모두 OFF
- 모바일/데스크톱 자동 반응형
========================== -->
<div id="cookie-banner" style="
position:fixed;
bottom:20px;
right:20px;
left:auto;
width:340px;
max-width:calc(100vw - 40px);
background:rgba(255,251,240,0.96);
backdrop-filter:blur(12px);
-webkit-backdrop-filter:blur(12px);
color:#5D4516;
padding:18px;
border-radius:16px;
box-shadow:0 10px 30px rgba(139,105,20,0.25);
border:0.5px solid rgba(184,134,11,0.3);
display:none;
z-index:9999;
font-size:13px;
line-height:1.5;
box-sizing:border-box;
">
  <div style="margin-bottom:12px;font-weight:600;font-size:14px;color:#5D4516;">
    🍪 쿠키 사용 안내
  </div>
  <div style="margin-bottom:14px;color:#6B5028;">
    더 나은 서비스를 위해 쿠키를 사용합니다.
    <a href="/privacy.html" style="color:#8B6914;text-decoration:underline;">자세히</a>
  </div>
  <div style="margin-bottom:14px;">
    <label style="display:flex;align-items:center;margin-bottom:8px;cursor:pointer;color:#5D4516;">
      <input type="checkbox" id="analyticsToggle" checked style="margin-right:8px;accent-color:#B8860B;">
      <span>서비스 개선</span>
    </label>
    <label style="display:flex;align-items:center;cursor:pointer;color:#5D4516;">
      <input type="checkbox" id="marketingToggle" style="margin-right:8px;accent-color:#B8860B;">
      <span>맞춤 광고</span>
    </label>
  </div>
  <div style="display:flex;gap:8px;">
    <button type="button" onclick="acceptAllCookies()" style="
    flex:1.5;
    padding:11px;
    background:#B8860B;
    color:#fff;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:600;
    font-size:14px;
    ">모두 동의</button>
    <button type="button" onclick="rejectCookies()" style="
    flex:1;
    padding:11px;
    background:#fff;
    color:#5D4516;
    border:0.5px solid rgba(184,134,11,0.4);
    border-radius:8px;
    cursor:pointer;
    font-size:13px;
    ">거부</button>
  </div>
</div>

<style>
@media (max-width: 480px) {
  #cookie-banner {
    bottom: 0 !important;
    right: 0 !important;
    left: 0 !important;
    width: 100% !important;
    max-width: 100% !important;
    border-radius: 16px 16px 0 0 !important;
  }
}
</style>

<script>
const savedConsent = localStorage.getItem('cookieChoice');
if (!savedConsent) {
  document.getElementById('cookie-banner').style.display = 'block';
} else {
  try {
    applyConsent(JSON.parse(savedConsent));
  } catch (error) {
    localStorage.removeItem('cookieChoice');
    document.getElementById('cookie-banner').style.display = 'block';
  }
}

function acceptAllCookies() {
  const consent = {
    analytics: true,
    marketing: true,
    timestamp: new Date().toISOString()
  };
  saveAndApply(consent);
}

function rejectCookies() {
  const consent = {
    analytics: false,
    marketing: false,
    timestamp: new Date().toISOString()
  };
  saveAndApply(consent);
}

function saveAndApply(consent) {
  localStorage.setItem('cookieChoice', JSON.stringify(consent));
  document.getElementById('cookie-banner').style.display = 'none';
  applyConsent(consent);
}

function applyConsent(consent) {
  if (consent.analytics) loadAnalytics();
  if (consent.marketing) loadAds();
}

function loadAnalytics() {
  if (window.analyticsLoaded) return;
  window.analyticsLoaded = true;
  var script = document.createElement('script');
  script.src = 'https://www.googletagmanager.com/gtag/js?id=G-1K6DBVER5W';
  script.async = true;
  document.head.appendChild(script);
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  window.gtag = gtag;
  gtag('js', new Date());
  gtag('config', 'G-1K6DBVER5W');
}

function loadAds() {
  if (window.adsLoaded) return;
  window.adsLoaded = true;
  // 7월 AdSense 승인 후 광고 스크립트는 여기에만 삽입
}
</script>
